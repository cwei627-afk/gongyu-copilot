          "data": {
            "type": "code",
            "title": "真实目录版本门禁",
            "desc": "独立扩容兼容层；冻结身份校验和生成后验",
            "selected": false,
            "code_language": "python3",
            "code": "\"\"\"Pure standard-library Code node functions, shared by Dify DSL and local tests.\n\nNo HTTP, SQL, vector search or LLM execution lives here. The workflow supplies responses.\n\"\"\"\nimport json\nimport hashlib\nimport math\nimport re\nfrom datetime import datetime, timezone\nfrom urllib.parse import quote\n\nFIELDS = {\"temperature\": [\"temperature_c\"], \"chemistry\": [\"carbon_pct\", \"silicon_pct\", \"manganese_pct\"],\n          \"all\": [\"temperature_c\", \"carbon_pct\", \"silicon_pct\", \"manganese_pct\"]}\nUNITS = {\"temperature_c\": \"°C\", \"carbon_pct\": \"%\", \"silicon_pct\": \"%\", \"manganese_pct\": \"%\"}\n\n\ndef packet(result, state=\"end\", query=\"\"):\n    context = result.get(\"data_used\") if isinstance(result.get(\"data_used\"), dict) else {}\n    heat = context.get(\"heat\") if isinstance(context.get(\"heat\"), dict) else {}\n    rule = context.get(\"rule\") if isinstance(context.get(\"rule\"), dict) else {}\n    effective_at_epoch = 0.0\n    try:\n        if context.get(\"snapshot_at\"):\n            effective_at_epoch = timestamp(context[\"snapshot_at\"]).timestamp()\n    except (TypeError, ValueError, AttributeError, OverflowError):\n        effective_at_epoch = 0.0\n    return {\n        \"state\": state,\n        \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False),\n        \"query\": query,\n        \"heat_id_encoded\": quote(result.get(\"heat_id\", \"\"), safe=\"\"),\n        \"scope\": context.get(\"scope\", \"\"),\n        \"steel_grade\": heat.get(\"steel_grade\", \"\"),\n        \"process_stage\": context.get(\"process_stage\", \"\"),\n        \"rule_id\": rule.get(\"rule_id\", \"\"),\n        \"effective_at_epoch\": effective_at_epoch,\n    }\n\n\ndef stop(result, category, code, message):\n    result.update(status=category + \"_error\", category=category, code=code, message=message,\n                  suggested_checks=[], sources=[])\n    return packet(result)\n\n\ndef begin(heat_id, analysis_request):\n    result = {\"heat_id\": heat_id if isinstance(heat_id, str) else \"\", \"analysis_request\": analysis_request,\n              \"status\": \"pending\", \"category\": None, \"code\": None, \"message\": \"\",\n              \"process_anomaly_confirmed\": None, \"anomaly_facts\": [], \"data_used\": {},\n              \"business_rules\": [], \"suggested_checks\": [], \"sources\": [], \"automatic_actions\": [],\n              \"human_confirmation\": \"涉及生产处置必须由授权人员人工复核确认；本结果不控制 PLC 或设备。\",\n              \"trace\": [\"validate_input\"]}\n    if (not isinstance(heat_id, str) or not 1 <= len(heat_id) <= 128\n            or re.search(r\"[\\s\\x00-\\x1f\\x7f/]\", heat_id) or analysis_request not in FIELDS):\n        return stop(result, \"request\", \"INVALID_PARAMETER\", \"提供有效 heat_id，并选择 temperature、chemistry 或 all。\")\n    return packet(result, \"continue\")\n\n\ndef http_body(result, status_code, body):\n    \"\"\"Return parsed data or a terminal packet. Never infer facts from transport failure.\"\"\"\n    if status_code in (401, 403) or status_code >= 500 or status_code <= 0 or status_code == 429:\n        return None, stop(result, \"system\", \"UPSTREAM_TIMEOUT\" if status_code == 504 else \"UPSTREAM_FAILURE\",\n                          \"业务系统调用失败，不能据此判断炉次存在性或工艺状态。\")\n    try:\n        data = json.loads(body)\n        if not isinstance(data, dict):\n            raise ValueError(\"not an object\")\n    except (ValueError, TypeError):\n        return None, stop(result, \"system\", \"INVALID_RESPONSE\", \"业务系统返回了无效响应。\")\n    if status_code != 200:\n        error = data.get(\"error\", {})\n        valid = (status_code == 404 and error.get(\"category\") == \"data\" and error.get(\"code\") == \"OBJECT_NOT_FOUND\"\n                 or status_code == 409 and error.get(\"category\") == \"data\"\n                 or status_code == 422 and error.get(\"category\") == \"request\")\n        if valid:\n            return None, stop(result, error[\"category\"], error.get(\"code\", \"INVALID_DATA\"),\n                              \"源系统确认对象不存在或数据/参数不可用，停止工艺推断。\")\n        return None, stop(result, \"system\", \"INVALID_RESPONSE\", \"未识别的接口失败语义，停止推断。\")\n    return data, None\n\n\ndef inspect_heat(previous, status_code, body):\n    result = json.loads(previous)\n    result[\"trace\"].append(\"query_heat\")\n    heat, terminal = http_body(result, status_code, body)\n    if terminal:\n        return terminal\n    if (heat.get(\"heat_id\") != result[\"heat_id\"]\n            or any(not isinstance(heat.get(k), str) or not heat[k].strip()\n                   for k in (\"steel_grade\", \"status\", \"updated_at\"))):\n        return stop(result, \"data\", \"INVALID_HEAT\", \"炉次身份或必要字段无效，停止推断。\")\n    result[\"data_used\"][\"initial_heat\"] = heat\n    return packet(result, \"continue\")\n\n\ndef timestamp(value):\n    parsed = datetime.fromisoformat(value.replace(\"Z\", \"+00:00\"))\n    if parsed.tzinfo is None:\n        raise ValueError(\"timezone required\")\n    return parsed\n\n\ndef finite_number(value):\n    if isinstance(value, bool) or not isinstance(value, (float, int)) or not math.isfinite(value):\n        raise ValueError(\"finite numeric value required\")\n    return value\n\n\ndef compare_context(previous, status_code, body):\n    result = json.loads(previous)\n    result[\"trace\"].append(\"query_context_and_rule\")\n    context, terminal = http_body(result, status_code, body)\n    if terminal:\n        return terminal\n    try:\n        heat, rule = context[\"heat\"], context[\"rule\"]\n        if heat != result[\"data_used\"][\"initial_heat\"]:\n            return stop(result, \"data\", \"SNAPSHOT_CHANGED\", \"两次查询之间炉次状态发生变化，请重新查询。\")\n        now, start = timestamp(context[\"snapshot_at\"]), timestamp(context[\"stage_started_at\"])\n        if not timestamp(rule[\"effective_from\"]) <= now < timestamp(rule[\"effective_until\"]):\n            return stop(result, \"data\", \"RULE_NOT_EFFECTIVE\", \"目标规则不在有效期内。\")\n        for key in (\"scope\", \"process_stage\"):\n            if not context[key] or context[key] != rule[key]:\n                return stop(result, \"data\", \"RULE_MISMATCH\", \"阶段或适用范围与规则不匹配。\")\n        if heat[\"steel_grade\"] != rule[\"steel_grade\"] or heat[\"status\"] != rule[\"required_status\"]:\n            return stop(result, \"data\", \"RULE_MISMATCH\", \"钢种或状态与规则不匹配。\")\n        age_limit = finite_number(rule[\"max_age_seconds\"])\n        if age_limit <= 0 or start > now:\n            raise ValueError(\"invalid freshness rule\")\n        if not 0 <= (now - timestamp(heat[\"updated_at\"])).total_seconds() <= age_limit:\n            return stop(result, \"data\", \"STALE_DATA\", \"炉次状态时间无效或已过期。\")\n        values = {}\n        for kind in (\"temperature\", \"chemistry\"):\n            measured = context[kind]\n            when = timestamp(measured[\"measured_at\"])\n            if measured[\"heat_id\"] != heat[\"heat_id\"]:\n                return stop(result, \"data\", \"HEAT_MISMATCH\", \"测量记录不属于该炉次。\")\n            if when < start or not 0 <= (now - when).total_seconds() <= age_limit:\n                return stop(result, \"data\", \"STALE_DATA\", \"测量来自前一阶段、未来或已过期。\")\n            for field in FIELDS[kind]:\n                values[field] = finite_number(measured[field])\n        # Validate every configured bound before any abnormality is emitted.\n        for field in FIELDS[\"all\"]:\n            limit = rule[\"limits\"][field]\n            if (finite_number(limit[\"minimum\"]) > finite_number(limit[\"maximum\"])\n                    or limit[\"unit\"] != UNITS[field]):\n                raise ValueError(\"invalid limits or units\")\n        if any(not rule[\"source\"].get(k) for k in\n               (\"document_name\", \"version\", \"effective_date\", \"chapter\", \"section\", \"page\")):\n            raise ValueError(\"rule provenance missing\")\n    except (KeyError, ValueError, TypeError, AttributeError, OverflowError):\n        return stop(result, \"data\", \"INVALID_CONTEXT\", \"实际数据或规则结构不完整/无效，停止工艺推断。\")\n\n    result[\"data_used\"] = context\n    result[\"business_rules\"] = [rule]\n    result[\"trace\"].append(\"compare_effective_limits\")\n    for field in FIELDS[result[\"analysis_request\"]]:\n        value, limit = values[field], rule[\"limits\"][field]\n        direction = \"low\" if value < limit[\"minimum\"] else \"high\" if value > limit[\"maximum\"] else None\n        if direction:\n            result[\"anomaly_facts\"].append({\"parameter\": field, \"actual\": value, \"unit\": limit[\"unit\"],\n                                            \"minimum\": limit[\"minimum\"], \"maximum\": limit[\"maximum\"],\n                                            \"direction\": direction, \"rule_id\": rule[\"rule_id\"]})\n    result[\"process_anomaly_confirmed\"] = bool(result[\"anomaly_facts\"])\n    if not result[\"anomaly_facts\"]:\n        result.update(status=\"no_anomaly\", category=None, code=\"WITHIN_EFFECTIVE_RULE\",\n                      message=\"本次所选参数在当前有效规则范围内；仅陈述已检查参数，不代表整炉质量合格。\")\n        return packet(result)\n    result.update(status=\"process_anomaly\", category=\"process\", code=\"RULE_VIOLATION\",\n                  message=\"已确认所选实测参数违反当前有效规则；尚未获得生产处置证据。\")\n    query = \" \".join([heat[\"steel_grade\"], context[\"scope\"], context[\"process_stage\"],\n                       \"异常检查项\", *[a[\"parameter\"] + \" \" + a[\"direction\"] for a in result[\"anomaly_facts\"]]])\n    return packet(result, \"retrieve\", query)\n\n\ndef sha256_text(value):\n    if not isinstance(value, str):\n        raise ValueError(\"text required\")\n    return hashlib.sha256(value.encode(\"utf-8\")).hexdigest()\n\n\ndef metadata_epoch(value):\n    if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):\n        raise ValueError(\"metadata epoch required\")\n    return float(value)\n\n\ndef same_epoch(value, expected):\n    return abs(metadata_epoch(value) - timestamp(expected).timestamp()) < 0.001\n\n\ndef verify_controlled_hit(hit, document):\n    \"\"\"Validate one Dify hit against the provisioned controlled-source registry.\n\n    The returned citation is built only from the validated hit. Registry values are\n    used as equality constraints and never copied into a citation.\n    \"\"\"\n    required_registry = (\n        \"dataset_id\", \"document_id\", \"segment_id\", \"source_file_name\", \"document_name\",\n        \"version\", \"effective_date\", \"effective_from\", \"effective_until\", \"status\", \"scope\",\n        \"steel_grade\", \"process_stage\", \"rule_id\", \"chapter\", \"section\", \"chunk_id\",\n        \"content\", \"content_sha256\", \"checks\", \"parameters\", \"directions\",\n    )\n    if any(key not in document or document[key] in (None, \"\") for key in required_registry):\n        return None, \"MISSING_CONTROLLED_IDENTITY\"\n    if not isinstance(hit, dict) or not isinstance(hit.get(\"content\"), str):\n        return None, \"MISSING_SOURCE_IDENTITY\"\n    metadata = hit.get(\"metadata\")\n    if not isinstance(metadata, dict) or not isinstance(metadata.get(\"doc_metadata\"), dict):\n        return None, \"MISSING_SOURCE_IDENTITY\"\n    doc_metadata = metadata[\"doc_metadata\"]\n    required_hit = (\"dataset_id\", \"document_id\", \"segment_id\", \"document_name\")\n    required_doc_metadata = (\n        \"document_name\", \"document_id\", \"controlled_document_name\", \"source_key\", \"version\",\n        \"effective_date\", \"effective_from\", \"effective_until\", \"status\", \"scope\", \"steel_grade\",\n        \"process_stage\", \"rule_id\", \"chapter\", \"section\", \"parameters\", \"directions\", \"content_sha256\",\n    )\n    if any(metadata.get(key) in (None, \"\") for key in required_hit):\n        return None, \"MISSING_SOURCE_IDENTITY\"\n    if any(doc_metadata.get(key) in (None, \"\") for key in required_doc_metadata):\n        return None, \"MISSING_METADATA\"\n    if any(key in metadata and metadata[key] != doc_metadata[key]\n           for key in (\"version\", \"status\", \"scope\", \"effective_date\")):\n        return None, \"METADATA_MISMATCH\"\n    if (metadata[\"dataset_id\"] != document[\"dataset_id\"]\n            or metadata[\"document_id\"] != document[\"document_id\"]\n            or metadata[\"segment_id\"] != document[\"segment_id\"]\n            or metadata[\"document_name\"] != document[\"source_file_name\"]\n            or doc_metadata[\"document_name\"] != metadata[\"document_name\"]\n            or doc_metadata[\"document_id\"] != metadata[\"document_id\"]\n            or doc_metadata[\"controlled_document_name\"] != document[\"document_name\"]\n            or doc_metadata[\"source_key\"] != document[\"chunk_id\"]):\n        return None, \"SOURCE_IDENTITY_MISMATCH\"\n    try:\n        expected_page = document.get(\"page\")\n        if (doc_metadata[\"version\"] != document[\"version\"]\n                or doc_metadata[\"status\"] != document[\"status\"]\n                or doc_metadata[\"scope\"] != document[\"scope\"]\n                or doc_metadata[\"steel_grade\"] != document[\"steel_grade\"]\n                or doc_metadata[\"process_stage\"] != document[\"process_stage\"]\n                or doc_metadata[\"rule_id\"] != document[\"rule_id\"]\n                or doc_metadata[\"chapter\"] != document[\"chapter\"]\n                or doc_metadata[\"section\"] != document[\"section\"]\n                or doc_metadata[\"parameters\"] != \",\".join(document[\"parameters\"])\n                or doc_metadata[\"directions\"] != \",\".join(document[\"directions\"])\n                or doc_metadata.get(\"page\") != expected_page\n                or not same_epoch(doc_metadata[\"effective_date\"], document[\"effective_date\"] + \"T00:00:00+00:00\")\n                or not same_epoch(doc_metadata[\"effective_from\"], document[\"effective_from\"])\n                or not same_epoch(doc_metadata[\"effective_until\"], document[\"effective_until\"])):\n            return None, \"METADATA_MISMATCH\"\n    except (TypeError, ValueError, AttributeError, OverflowError):\n        return None, \"INVALID_METADATA\"\n    content_hash = sha256_text(hit[\"content\"])\n    if (content_hash != document[\"content_sha256\"]\n            or doc_metadata[\"content_sha256\"] != content_hash\n            or document[\"content\"] not in hit[\"content\"]):\n        return None, \"CONTENT_HASH_MISMATCH\"\n    citation = {\n        \"dataset_id\": metadata[\"dataset_id\"],\n        \"document_id\": metadata[\"document_id\"],\n        \"segment_id\": metadata[\"segment_id\"],\n        \"document_name\": metadata[\"document_name\"],\n        \"display_name\": doc_metadata[\"controlled_document_name\"],\n        \"version\": doc_metadata[\"version\"],\n        \"effective_date\": datetime.fromtimestamp(\n            metadata_epoch(doc_metadata[\"effective_date\"]), timezone.utc\n        ).date().isoformat(),\n        \"chapter\": doc_metadata[\"chapter\"],\n        \"section\": doc_metadata[\"section\"],\n        \"page\": doc_metadata.get(\"page\"),\n        \"chunk_id\": doc_metadata[\"source_key\"],\n        \"content_sha256\": content_hash,\n        \"quote\": hit[\"content\"],\n    }\n    return citation, None\n\n\ndef controlled_fixture_hit(document):\n    \"\"\"Create an explicit local-test hit; production Workflow receives Dify hits.\"\"\"\n    content = document[\"content\"]\n    return {\n        \"title\": document[\"source_file_name\"],\n        \"content\": content,\n        \"metadata\": {\n            \"dataset_id\": document[\"dataset_id\"],\n            \"document_id\": document[\"document_id\"],\n            \"segment_id\": document[\"segment_id\"],\n            \"document_name\": document[\"source_file_name\"],\n            \"doc_metadata\": {\n                \"document_name\": document[\"source_file_name\"],\n                \"document_id\": document[\"document_id\"],\n                \"controlled_document_name\": document[\"document_name\"],\n                \"source_key\": document[\"chunk_id\"],\n                \"version\": document[\"version\"],\n                \"effective_date\": timestamp(document[\"effective_date\"] + \"T00:00:00+00:00\").timestamp(),\n                \"effective_from\": timestamp(document[\"effective_from\"]).timestamp(),\n                \"effective_until\": timestamp(document[\"effective_until\"]).timestamp(),\n                \"status\": document[\"status\"],\n                \"scope\": document[\"scope\"],\n                \"steel_grade\": document[\"steel_grade\"],\n                \"process_stage\": document[\"process_stage\"],\n                \"rule_id\": document[\"rule_id\"],\n                \"chapter\": document[\"chapter\"],\n                \"section\": document[\"section\"],\n                \"page\": document.get(\"page\"),\n                \"parameters\": \",\".join(document[\"parameters\"]),\n                \"directions\": \",\".join(document[\"directions\"]),\n                \"content_sha256\": document[\"content_sha256\"],\n            },\n        },\n    }\n\n\ndef evidence_decision(previous, retrieval_result, manifest, retrieval_failed=False):\n    \"\"\"Finite, pre-reviewed demo checklist mapping, NOT arbitrary semantic entailment.\n\n    Only exact controlled passages that support each confirmed deviation can pass.\n    User input and retrieval score cannot supply rules, quotes or equipment commands.\n    \"\"\"\n    result = json.loads(previous)\n    result[\"trace\"].append(\"retrieve_and_validate_evidence\")\n    if result.get(\"status\") != \"process_anomaly\":\n        return stop(result, \"system\", \"INVALID_TRANSITION\", \"无已确认工艺异常，不得进入建议分支。\")\n    if retrieval_failed:\n        return stop(result, \"system\", \"RETRIEVAL_FAILED\", \"已确认异常事实，但知识检索失败；不能生成处置建议，请人工确认。\")\n    missing, sources, checks = [], [], []\n    try:\n        if not isinstance(retrieval_result, list):\n            raise ValueError(\"invalid retrieval result\")\n        context = result[\"data_used\"]\n        as_of = timestamp(context[\"snapshot_at\"])\n        # Every returned hit must have a verifiable current source, including\n        # extra hits that do not support this particular deviation.\n        for hit in retrieval_result:\n            metadata = hit.get(\"metadata\", {}) if isinstance(hit, dict) else {}\n            document_id = metadata.get(\"document_id\") if isinstance(metadata, dict) else None\n            registered = [d for d in manifest[\"documents\"] if d.get(\"document_id\") == document_id]\n            if len(registered) != 1:\n                missing.append(\"UNVERIFIED_RETRIEVAL_SOURCE\")\n                continue\n            document = registered[0]\n            citation, reason = verify_controlled_hit(hit, document)\n            if reason:\n                missing.append(reason)\n            elif (document[\"status\"] != \"active\"\n                  or not timestamp(document[\"effective_from\"]) <= as_of < timestamp(document[\"effective_until\"])\n                  or document[\"scope\"] != context[\"scope\"]\n                  or document[\"steel_grade\"] != context[\"heat\"][\"steel_grade\"]\n                  or document[\"process_stage\"] != context[\"process_stage\"]\n                  or document[\"rule_id\"] != context[\"rule\"][\"rule_id\"]):\n                missing.append(\"INAPPLICABLE_RETRIEVAL_SOURCE\")\n        for anomaly in result[\"anomaly_facts\"]:\n            relevant = [d for d in manifest[\"documents\"]\n                        if d.get(\"scope\") == context[\"scope\"]\n                        and d.get(\"steel_grade\") == context[\"heat\"][\"steel_grade\"]\n                        and d.get(\"process_stage\") == context[\"process_stage\"]\n                        and anomaly[\"parameter\"] in d.get(\"parameters\", [])\n                        and anomaly[\"direction\"] in d.get(\"directions\", [])\n                        and d.get(\"rule_id\") == anomaly[\"rule_id\"]]\n            malformed = [d for d in relevant if d.get(\"status\") == \"active\"\n                         and any(d.get(key) in (None, \"\") for key in\n                                 (\"version\", \"effective_date\", \"effective_from\", \"effective_until\"))]\n            if malformed:\n                missing.append(\"MISSING_METADATA\")\n                continue\n            matches = [d for d in relevant if d.get(\"status\") == \"active\"\n                       and timestamp(d[\"effective_from\"]) <= as_of < timestamp(d[\"effective_until\"])]\n            if len(matches) != 1:\n                missing.append(\"VERSION_CONFLICT\" if len(matches) > 1 else \"NO_APPLICABLE_EVIDENCE\")\n                continue\n            doc = matches[0]\n            verified = []\n            rejected = []\n            for hit in retrieval_result:\n                citation, reason = verify_controlled_hit(hit, doc)\n                if citation:\n                    verified.append(citation)\n                elif reason:\n                    rejected.append(reason)\n                    if isinstance(hit, dict):\n                        metadata = hit.get(\"metadata\") or {}\n                        doc_metadata = metadata.get(\"doc_metadata\") or {} if isinstance(metadata, dict) else {}\n                        claims_source = (isinstance(metadata, dict) and (\n                            metadata.get(\"document_id\") == doc.get(\"document_id\")\n                            or isinstance(doc_metadata, dict) and doc_metadata.get(\"source_key\") == doc.get(\"chunk_id\")))\n                        contains_passage = isinstance(hit.get(\"content\"), str) and doc[\"content\"] in hit[\"content\"]\n                        if claims_source or contains_passage:\n                            missing.append(reason)\n            if len(verified) != 1:\n                missing.extend(rejected or [\"NO_DIRECT_SUPPORT\"])\n                continue\n            if not doc[\"checks\"] or any(check not in doc[\"content\"] for check in doc[\"checks\"]):\n                missing.append(\"INVALID_CHECKLIST\")\n                continue\n            source = verified[0]\n            if source not in sources:\n                sources.append(source)\n            for check in doc[\"checks\"]:\n                item = {\"text\": check, \"chunk_id\": source[\"chunk_id\"], \"segment_id\": source[\"segment_id\"]}\n                if item not in checks:\n                    checks.append(item)\n    except (KeyError, TypeError, ValueError, AttributeError):\n        missing.append(\"INVALID_EVIDENCE\")\n    if missing:\n        result.update(status=\"abstain\", code=\"INSUFFICIENT_EVIDENCE\", evidence_reason_codes=sorted(set(missing)),\n                      message=\"异常事实已确认，但正式规程证据不足。拒绝生成确定性处置建议，请人工确认。\",\n                      suggested_checks=[], sources=[])\n        return packet(result)\n    result.update(status=\"review_required\", code=\"SUPPORTED_CHECKLIST\",\n                  message=\"异常事实和对应规则已核对；下列检查项摘自有效正式演示规程，须人工确认。\",\n                  suggested_checks=checks, sources=sources)\n    result[\"trace\"].append(\"compose_six_part_report\")\n    return packet(result)\n\n\ndef evidence_abstain(result, reasons):\n    result.update(status=\"abstain\", code=\"INSUFFICIENT_EVIDENCE\",\n                  evidence_reason_codes=sorted(set(reasons)),\n                  message=\"异常事实已确认，但受控来源或当前版本不可验证；停止建议并请求人工确认。\",\n                  suggested_checks=[], sources=[])\n    return packet(result)\n\n\ndef inspect_catalog(previous, status_code, body, manifest):\n    \"\"\"Check the whole live Dify catalog, so top-k cannot hide version conflicts.\"\"\"\n    result = json.loads(previous)\n    result[\"trace\"].append(\"validate_live_source_catalog\")\n    if result.get(\"status\") != \"process_anomaly\":\n        return stop(result, \"system\", \"INVALID_TRANSITION\", \"没有确认的异常事实，停止证据流程。\")\n    if status_code != 200:\n        return stop(result, \"system\", \"KNOWLEDGE_CATALOG_FAILURE\", \"知识目录接口失败，停止建议并请求人工确认。\")\n    reasons = []\n    try:\n        catalog = json.loads(body)\n        documents = catalog[\"data\"]\n        if (not isinstance(documents, list) or catalog.get(\"has_more\") is not False\n                or catalog.get(\"page\") != 1 or catalog.get(\"total\") != len(documents)):\n            raise ValueError(\"incomplete catalog\")\n        context = result[\"data_used\"]\n        as_of = timestamp(context[\"snapshot_at\"]).timestamp()\n        current = []\n        seen = set()\n        controlled = {doc[\"document_id\"]: doc for doc in manifest[\"documents\"]}\n        if len(controlled) != len(manifest[\"documents\"]):\n            raise ValueError(\"duplicate controlled document identity\")\n        for entry in documents:\n            if entry[\"id\"] in seen:\n                raise ValueError(\"duplicate catalog identity\")\n            seen.add(entry[\"id\"])\n            if entry.get(\"enabled\") is not True or entry.get(\"archived\") is not False:\n                continue\n            metadata_list = entry[\"doc_metadata\"]\n            if not isinstance(metadata_list, list):\n                raise ValueError(\"structured catalog metadata required\")\n            metadata = {item[\"name\"]: item[\"value\"] for item in metadata_list}\n            if len(metadata) != len(metadata_list):\n                raise ValueError(\"duplicate metadata\")\n            if metadata.get(\"status\") in (\"expired\", \"revoked\", \"inactive\", \"future\"):\n                continue\n            required = (\"status\", \"scope\", \"steel_grade\", \"process_stage\", \"rule_id\", \"version\",\n                        \"effective_date\", \"effective_from\", \"effective_until\", \"parameters\", \"directions\")\n            if any(metadata.get(key) in (None, \"\") for key in required):\n                reasons.append(\"MISSING_METADATA\")\n                continue\n            if metadata[\"status\"] != \"active\":\n                reasons.append(\"INVALID_METADATA\")\n                continue\n            start, end = metadata_epoch(metadata[\"effective_from\"]), metadata_epoch(metadata[\"effective_until\"])\n            effective_date = metadata_epoch(metadata[\"effective_date\"])\n            if start >= end or effective_date != start:\n                reasons.append(\"INVALID_METADATA\")\n                continue\n            if not start <= as_of < end:\n                continue\n            if (metadata[\"scope\"] != context[\"scope\"]\n                    or metadata[\"steel_grade\"] != context[\"heat\"][\"steel_grade\"]\n                    or metadata[\"process_stage\"] != context[\"process_stage\"]\n                    or metadata[\"rule_id\"] != context[\"rule\"][\"rule_id\"]):\n                continue\n            current.append(metadata)\n            doc = controlled.get(entry[\"id\"])\n            if not doc or entry.get(\"indexing_status\") != \"completed\":\n                reasons.append(\"UNCONTROLLED_CURRENT_SOURCE\")\n                continue\n            expected = controlled_fixture_hit(doc)[\"metadata\"][\"doc_metadata\"]\n            if entry.get(\"name\") != doc[\"source_file_name\"] or any(\n                    metadata.get(key) != value for key, value in expected.items()):\n                reasons.append(\"CATALOG_METADATA_MISMATCH\")\n        for anomaly in result[\"anomaly_facts\"]:\n            matches = [meta for meta in current if anomaly[\"parameter\"] in meta[\"parameters\"].split(\",\")\n                       and anomaly[\"direction\"] in meta[\"directions\"].split(\",\")]\n            if len(matches) != 1:\n                reasons.append(\"VERSION_CONFLICT\" if len(matches) > 1 else \"NO_APPLICABLE_EVIDENCE\")\n    except (KeyError, TypeError, ValueError, AttributeError, OverflowError):\n        reasons.append(\"INVALID_SOURCE_CATALOG\")\n    return evidence_abstain(result, reasons) if reasons else packet(result, \"retrieve\")\n\n\ndef evidence_with_catalog(previous, retrieval_result, status_code, body, manifest):\n    catalog = inspect_catalog(previous, status_code, body, manifest)\n    if catalog[\"state\"] != \"retrieve\":\n        return catalog\n    return evidence_decision(catalog[\"result\"], retrieval_result, manifest)\n\n\ndef transport_failure(previous, stage):\n    result = json.loads(previous)\n    result[\"trace\"].append(stage + \"_transport_failure\")\n    return stop(result, \"system\", \"TRANSPORT_FAILURE\", \"系统调用失败，停止后续推断或建议，提示人工确认。\")\n\n\"\"\"Stage B: bounded DeepSeek synthesis after the unchanged Stage A evidence gate.\n\nStandard-library only, so the same parser/schema/coverage checks run in Dify Code.\nNo free-text entailment claim: output sentences must equal allowed MES/rule facts\nor pre-reviewed checks. Sources are copied from verified hits, never from the LLM.\n\"\"\"\nimport copy\nimport hashlib\nimport json\nimport re\n\n\ndef object_schema(properties):\n    return {\"type\": \"object\", \"properties\": properties, \"required\": list(properties), \"additionalProperties\": False}\n\n\nTEXT = {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 16000}\nID = {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 128}\nSOURCE_SCHEMA = object_schema({\n    \"citation_id\": ID, \"dataset_id\": ID, \"document_id\": ID, \"segment_id\": ID,\n    \"document_name\": TEXT, \"version\": ID, \"effective_date\": ID, \"scope\": ID,\n    \"chapter\": TEXT, \"section\": TEXT,\n    \"page\": {\"type\": [\"integer\", \"null\"], \"minimum\": 1},\n    \"content_sha256\": {\"type\": \"string\", \"pattern\": \"^[0-9a-f]{64}$\"},\n})\nCLAIM_SCHEMA = object_schema({\"claim_id\": ID, \"text\": TEXT})\nCHECK_SCHEMA = object_schema({\"check_id\": ID, \"text\": TEXT,\n                             \"citation_ids\": {\"type\": \"array\", \"items\": ID, \"minItems\": 1, \"maxItems\": 8}})\nGENERATION_SCHEMA = object_schema({\n    \"answer\": TEXT,\n    \"analysis_summary\": {\"type\": \"array\", \"items\": CLAIM_SCHEMA, \"minItems\": 1, \"maxItems\": 8},\n    \"check_recommendations\": {\"type\": \"array\", \"items\": CHECK_SCHEMA, \"minItems\": 1, \"maxItems\": 32},\n    \"citations\": {\"type\": \"array\", \"items\": SOURCE_SCHEMA, \"minItems\": 1, \"maxItems\": 8},\n    \"human_confirmation\": TEXT,\n})\nFINAL_GENERATION_SCHEMA = object_schema({\n    \"schema_version\": {\"type\": \"string\", \"pattern\": \"^1\\\\.0$\"},\n    \"model\": {\"type\": \"string\", \"pattern\": \"^deepseek-flash$\"},\n    \"request_id\": ID,\n    **GENERATION_SCHEMA[\"properties\"],\n})\n\n\nclass GenerationError(ValueError):\n    pass\n\n\ndef validate_schema(value, schema):\n    \"\"\"Validate the exact closed JSON Schema subset above; no type coercion.\n\n    This validator is deliberately limited to our checked schema keywords, not\n    a replacement for a general-purpose JSON Schema library.\n    \"\"\"\n    known = {\"type\", \"properties\", \"required\", \"additionalProperties\", \"items\", \"minItems\", \"maxItems\",\n             \"minLength\", \"maxLength\", \"minimum\", \"pattern\"}\n    if set(schema) - known: raise GenerationError(\"UNSUPPORTED_SCHEMA\")\n    types = schema[\"type\"] if isinstance(schema[\"type\"], list) else [schema[\"type\"]]\n    kinds = {\"object\": dict, \"array\": list, \"string\": str, \"integer\": int, \"null\": type(None)}\n    if not any(type(value) is kinds[k] for k in types): raise GenerationError(\"SCHEMA_TYPE\")\n    if value is None: return\n    if isinstance(value, dict):\n        if set(value) != set(schema[\"required\"]): raise GenerationError(\"SCHEMA_FIELDS\")\n        for key, item in value.items(): validate_schema(item, schema[\"properties\"][key])\n    elif isinstance(value, list):\n        if not schema.get(\"minItems\", 0) <= len(value) <= schema.get(\"maxItems\", 100):\n            raise GenerationError(\"SCHEMA_ARRAY_LENGTH\")\n        for item in value: validate_schema(item, schema[\"items\"])\n    elif isinstance(value, str):\n        if not schema.get(\"minLength\", 0) <= len(value) <= schema.get(\"maxLength\", 16000):\n            raise GenerationError(\"SCHEMA_STRING_LENGTH\")\n        if \"pattern\" in schema and not re.fullmatch(schema[\"pattern\"], value): raise GenerationError(\"SCHEMA_PATTERN\")\n    elif type(value) is int and value < schema.get(\"minimum\", value): raise GenerationError(\"SCHEMA_MINIMUM\")\n\n\ndef no_duplicate_keys(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result: raise GenerationError(\"DUPLICATE_JSON_KEY\")\n        result[key] = value\n    return result\n\n\ndef strict_json(text):\n    return json.loads(text, object_pairs_hook=no_duplicate_keys,\n                      parse_constant=lambda value: (_ for _ in ()).throw(GenerationError(\"NONFINITE_JSON\")))\n\n\ndef parse_model_text(text):\n    \"\"\"Recognize complete wrappers only, then consume one complete JSON object.\n\n    Never search for the first/last brace or repair malformed/truncated JSON.\n    Arbitrary prose, multiple objects, incomplete/nested reasoning tags fail.\n    \"\"\"\n    if not isinstance(text, str) or len(text) > 100000: raise GenerationError(\"INVALID_MODEL_TEXT\")\n    text, reasoning = text.strip(), \"\"\n    if text.startswith(\"<think>\"):\n        end = text.find(\"</think>\", len(\"<think>\"))\n        if end < 0: raise GenerationError(\"UNCLOSED_THINK\")\n        reasoning = text[len(\"<think>\"):end]\n        if \"<think>\" in reasoning: raise GenerationError(\"NESTED_THINK\")\n        text = text[end + len(\"</think>\"):].strip()\n    if text.startswith(\"```\"):\n        lines = text.splitlines()\n        if len(lines) < 3 or lines[0] not in (\"```\", \"```json\") or lines[-1] != \"```\":\n            raise GenerationError(\"INVALID_CODE_FENCE\")\n        text = \"\\n\".join(lines[1:-1])\n    try:\n        value = strict_json(text)\n    except (ValueError, TypeError, RecursionError) as exc:\n        raise GenerationError(\"INVALID_JSON\") from exc\n    return value, reasoning\n\n\ndef stable_id(prefix, payload):\n    value = json.dumps(payload, ensure_ascii=False, sort_keys=True, allow_nan=False)\n    return prefix + hashlib.sha256(value.encode(\"utf-8\")).hexdigest()[:32]\n\n\ndef render_answer(summary, checks, human):\n    return \"\\n\".join([item[\"text\"] for item in summary] +\n                     [item[\"text\"] + \" \" + \" \".join(\"[cite:\" + key + \"]\" for key in item[\"citation_ids\"])\n                      for item in checks] + [human])\n\n\ndef generation_catalog(previous, retrieval_result, request_id=None):\n    \"\"\"Bind this generation request to Stage A verified sources and native hits.\"\"\"\n    result = strict_json(previous)\n    if result.get(\"status\") != \"review_required\" or not result.get(\"sources\"):\n        raise GenerationError(\"UNVERIFIED_GENERATION_INPUT\")\n    if not isinstance(request_id, str) or not 1 <= len(request_id) <= 128:\n        raise GenerationError(\"MISSING_GENERATION_REQUEST_ID\")\n    binding = [request_id, result[\"heat_id\"], result[\"analysis_request\"], result[\"data_used\"][\"snapshot_at\"]]\n    citations, by_segment = [], {}\n    for source in result[\"sources\"]:\n        matches = [hit for hit in retrieval_result if isinstance(hit, dict) and isinstance(hit.get(\"metadata\"), dict)\n                   and all(hit[\"metadata\"].get(k) == source[k] for k in (\"dataset_id\", \"document_id\", \"segment_id\"))]\n        if len(matches) != 1: raise GenerationError(\"VERIFIED_HIT_NOT_AVAILABLE\")\n        hit = matches[0]; metadata = hit[\"metadata\"].get(\"doc_metadata\", {})\n        if (hit.get(\"content\") != source[\"quote\"]\n                or hashlib.sha256(hit[\"content\"].encode(\"utf-8\")).hexdigest() != source[\"content_sha256\"]\n                or metadata.get(\"scope\") != result[\"data_used\"][\"scope\"]\n                or any(metadata.get(k) != source[k] for k in (\"version\", \"chapter\", \"section\", \"page\", \"content_sha256\"))):\n            raise GenerationError(\"VERIFIED_HIT_CHANGED\")\n        citation = {key: source[key] for key in SOURCE_SCHEMA[\"properties\"] if key not in (\"citation_id\", \"scope\")}\n        citation[\"scope\"] = metadata[\"scope\"]\n        citation[\"citation_id\"] = stable_id(\"cite_\", [binding, citation])\n        citations.append(citation)\n        by_segment[source[\"segment_id\"]] = citation[\"citation_id\"]\n    summary = []\n    for fact in result[\"anomaly_facts\"]:\n        direction = \"低于下限\" if fact[\"direction\"] == \"low\" else \"高于上限\"\n        text = (f\"{fact['parameter']} 实测 {fact['actual']} {fact['unit']}；MES 当前规则 {fact['rule_id']} \"\n                f\"范围 [{fact['minimum']}, {fact['maximum']}] {fact['unit']}；{direction}。\")\n        summary.append({\"claim_id\": stable_id(\"fact_\", [binding, fact]), \"text\": text})\n    checks = [{\"check_id\": stable_id(\"check_\", [binding, item]), \"text\": item[\"text\"],\n               \"citation_ids\": [by_segment[item[\"segment_id\"]]]} for item in result[\"suggested_checks\"]]\n    catalog = {\"answer\": render_answer(summary, checks, result[\"human_confirmation\"]), \"analysis_summary\": summary,\n               \"check_recommendations\": checks, \"citations\": citations, \"human_confirmation\": result[\"human_confirmation\"]}\n    validate_schema(catalog, GENERATION_SCHEMA)\n    return catalog\n\n\ndef generation_failure(previous, code=\"LLM_PROVIDER_FAILURE\", category=\"system\"):\n    result = strict_json(previous)\n    result.update(status=\"abstain\" if category == \"evidence\" else \"system_error\", category=category, code=code,\n                  message=\"生成或引用校验未通过，无法确认处置建议；请人工核对原始事实与企业规程。\",\n                  sources=[], suggested_checks=[], automatic_actions=[])\n    result.pop(\"generation\", None)\n    result[\"trace\"].append(\"generation_fail_closed\")\n    return {\"state\": \"end\", \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False)}\n\n\ndef prepare_generation(previous, retrieval_result, request_id=None):\n    result = strict_json(previous)\n    if result.get(\"status\") != \"review_required\":\n        return {\"state\": \"end\", \"result\": previous, \"payload\": \"\"}\n    try:\n        catalog = generation_catalog(previous, retrieval_result, request_id)\n        return {\"state\": \"generate\", \"result\": previous,\n                \"payload\": json.dumps(catalog, ensure_ascii=False, allow_nan=False)}\n    except (KeyError, ValueError, TypeError, AttributeError):\n        failure = generation_failure(previous, \"UNVERIFIED_GENERATION_INPUT\", \"evidence\")\n        return {**failure, \"payload\": \"\"}\n\n\ndef validate_generation(previous, retrieval_result, text, structured_output=None, finish_reason=\"stop\", reasoning_content=\"\", request_id=None):\n    try:\n        catalog = generation_catalog(previous, retrieval_result, request_id)\n        allowed = {item[\"citation_id\"]: item for item in catalog[\"citations\"]}\n        if finish_reason not in (\"stop\", \"tool_calls\"): raise GenerationError(\"INCOMPLETE_MODEL_OUTPUT\")\n        reasoning = reasoning_content or \"\"\n        if not isinstance(reasoning, str): raise GenerationError(\"INVALID_REASONING\")\n        parsed = None\n        if text:\n            parsed, tagged_reasoning = parse_model_text(text)\n            reasoning += tagged_reasoning\n        if structured_output is not None:\n            validate_schema(structured_output, GENERATION_SCHEMA)\n            if parsed is not None and parsed != structured_output: raise GenerationError(\"NATIVE_TEXT_MISMATCH\")\n            parsed = structured_output\n        validate_schema(parsed, GENERATION_SCHEMA)\n        # Reasoning is never rendered; explicit forged references still reject.\n        references = re.finditer(r\"\\[cite:([^\\]]+)\\]|\\bcite_[0-9a-f]{32}\\b|citation_id[\\\"']?\\s*:\\s*[\\\"']([^\\\"']+)\", reasoning)\n        flattened = [match.group(1) or match.group(2) or match.group(0) for match in references]\n        # Syntax-only templates in private reasoning are not source identities.\n        # They are never rendered, and are NOT allowed in the final citations.\n        templates = {\"citation_id\", \"...\", \"<citation_id>\", \"<id>\"}\n        if any(key not in allowed and key not in templates for key in flattened):\n            raise GenerationError(\"UNAUTHORIZED_REASONING_CITATION\")\n        citations = parsed[\"citations\"]\n        ids = [source[\"citation_id\"] for source in citations]\n        if len(ids) != len(set(ids)) or set(ids) != set(allowed): raise GenerationError(\"CITATION_COVERAGE\")\n        if any(source != allowed[source[\"citation_id\"]] for source in citations): raise GenerationError(\"CITATION_METADATA_CHANGED\")\n        for field, identifier in ((\"analysis_summary\", \"claim_id\"), (\"check_recommendations\", \"check_id\")):\n            expected = {item[identifier]: item for item in catalog[field]}\n            actual_ids = [item[identifier] for item in parsed[field]]\n            if len(actual_ids) != len(set(actual_ids)) or set(actual_ids) != set(expected):\n                raise GenerationError(\"CLAIM_COVERAGE\")\n            if any(item != expected[item[identifier]] for item in parsed[field]): raise GenerationError(\"UNSUPPORTED_GENERATED_CLAIM\")\n        if parsed[\"human_confirmation\"] != catalog[\"human_confirmation\"]: raise GenerationError(\"HUMAN_CONFIRMATION_CHANGED\")\n        if parsed[\"answer\"] != render_answer(parsed[\"analysis_summary\"], parsed[\"check_recommendations\"], parsed[\"human_confirmation\"]):\n            raise GenerationError(\"ANSWER_CITATION_MISMATCH\")\n        result = strict_json(previous)\n        # Authoritative citations are copied from the bound hit catalog, not the model echo.\n        safe = copy.deepcopy(parsed)\n        safe[\"citations\"] = [copy.deepcopy(allowed[key]) for key in ids]\n        result[\"generation\"] = {\"schema_version\": \"1.0\", \"model\": \"deepseek-flash\", \"request_id\": request_id, **safe}\n        validate_schema(result[\"generation\"], FINAL_GENERATION_SCHEMA)\n        result[\"code\"] = \"SUPPORTED_GENERATION\"\n        result[\"trace\"] += [\"deepseek_synthesis\", \"validate_generation_schema\", \"validate_citation_coverage\"]\n        return {\"state\": \"end\", \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False)}\n    except GenerationError as exc:\n        reason = str(exc)\n        evidence = reason in {\"UNVERIFIED_GENERATION_INPUT\", \"VERIFIED_HIT_NOT_AVAILABLE\", \"VERIFIED_HIT_CHANGED\",\n                              \"MISSING_GENERATION_REQUEST_ID\",\n                              \"CITATION_COVERAGE\", \"CITATION_METADATA_CHANGED\", \"CLAIM_COVERAGE\",\n                              \"UNSUPPORTED_GENERATED_CLAIM\", \"UNAUTHORIZED_REASONING_CITATION\",\n                              \"ANSWER_CITATION_MISMATCH\", \"HUMAN_CONFIRMATION_CHANGED\"}\n        return generation_failure(previous, reason, \"evidence\" if evidence else \"system\")\n    except (KeyError, ValueError, TypeError, AttributeError, RecursionError):\n        return generation_failure(previous, \"GENERATION_INVALID_OUTPUT\")\n\n\"\"\"Stage E1 deterministic adapters around frozen Stage A/B verification primitives.\n\nReviewed question aliases and exact source quotes are a finite PoC support map,\nnot a claim to arbitrary natural-language entailment. No fabricated MES context.\n\"\"\"\nimport copy\nimport hashlib\nimport json\nimport math\nimport re\nfrom datetime import datetime, timezone\n\n\nQA_POINT = object_schema({'claim_id': ID, 'text': TEXT,\n    'citation_ids': {'type': 'array', 'items': ID, 'minItems': 1, 'maxItems': 2}})\nQA_SCHEMA = object_schema({'answer': TEXT,\n    'supported_points': {'type': 'array', 'items': QA_POINT, 'minItems': 1, 'maxItems': 6},\n    'citations': {'type': 'array', 'items': SOURCE_SCHEMA, 'minItems': 1, 'maxItems': 2},\n    'applicability': TEXT, 'human_confirmation': TEXT})\nQA_BOUNDARY = '仅适用于虚构 DEMO-LINE-A、DEMO-A 钢种的 review 复核阶段；偏差须先由有效 DEMO-RULE-A-REVIEW-v1 确认。本回答不证明任何实际炉次异常，不适用于转炉终点或其他钢种/阶段。'\nQA_HUMAN = '只说明企业演示规程原文要求；现场判断和生产操作须由有权限人员人工确认，不执行设备或 PLC 控制。'\n\nQA_ALIASES = {\n    'temperature': ['温度偏差时规程要求检查什么', '温度异常时规程要求检查什么',\n        'DEMO-A钢种复核阶段温度偏差时规程要求检查什么', '温度不对劲规程让我们核对啥',\n        '温度超出标准后有哪些人工核查要求'],\n    'chemistry': ['成分偏差时规程要求检查什么', '成分不对劲要核对哪些记录'],\n    'roles': ['现行规程对相关岗位的职责有什么要求', '温度和成分偏差分别由谁人工确认'],\n    'both': ['温度和成分偏差时规程分别要求检查什么'],\n    'partial': ['温度偏差要检查什么以及如何调整设备参数'],\n    'missing': ['生产温度记录缺失时应该核查哪些记录'],\n}\n\n\ndef qa_normalize(question):\n    return re.sub(r'[\\s？?，,。.!！：:；;、]', '', question)\n\n\ndef qa_packet(result, state='end', payload=''):\n    return {'state': state, 'result': json.dumps(result, ensure_ascii=False, allow_nan=False),\n        'payload': payload, 'effective_epoch': timestamp(result['as_of']).timestamp()}\n\n\ndef qa_stop(previous, code, system=False, covered=None):\n    result = strict_json(previous) if isinstance(previous, str) else copy.deepcopy(previous)\n    result.update(status='system_error' if system else 'abstain', code=code, answer='',\n        citations=[], supported_points=[], automatic_actions=[],\n        message='系统调用或生成失败，企业规定暂时无法确认。' if system else '没有充分且有效的企业证据，无法确认完整答案；请人工确认或补充适用规程。',\n        confirmed_points=covered or [], human_confirmation=QA_HUMAN)\n    result.pop('generation', None)\n    return qa_packet(result)\n\n\ndef qa_begin(question, request_id, as_of=None):\n    result = {'question': question if isinstance(question, str) else '', 'request_id': request_id,\n        'as_of': as_of or datetime.now(timezone.utc).isoformat(), 'status': 'pending',\n        'code': 'INPUT_VALIDATED', 'citations': [], 'automatic_actions': []}\n    try:\n        timestamp(result['as_of'])\n        if not isinstance(request_id, str) or not 1 <= len(request_id) <= 128: raise ValueError()\n        if not isinstance(question, str) or not question.strip() or len(question) > 1000:\n            return qa_stop(result, 'INVALID_QUESTION')\n        if re.search(r'忽略|跳过|行业经验|凭经验|预训练|系统提示|system prompt|ignore|假装|编造|<think>|\\[cite:', question, re.I):\n            return qa_stop(result, 'UNTRUSTED_QUESTION_INSTRUCTION')\n        if re.search(r'PLC|自动执行|写入|直接控制|设备控制参数', question, re.I):\n            return qa_stop(result, 'READ_ONLY_KNOWLEDGE_ONLY')\n        normalized = qa_normalize(question)\n        result['question_kind'] = next((key for key, aliases in QA_ALIASES.items()\n            if normalized in [qa_normalize(alias) for alias in aliases]), 'unsupported')\n        return qa_packet(result, 'catalog', json.dumps({'model':'qwen3-embedding:0.6b','input':question},ensure_ascii=False))\n    except (ValueError, TypeError):\n        # Invalid internal time/request binding must not become permissive.\n        result['as_of'] = datetime.now(timezone.utc).isoformat()\n        return qa_stop(result, 'INVALID_REQUEST_BINDING', True)\n\n\ndef qa_catalog_view(status_code, body, manifest, as_of):\n    if status_code != 200: raise GenerationError('KNOWLEDGE_CATALOG_FAILURE')\n    catalog = strict_json(body)\n    entries = catalog['data']\n    if (not isinstance(entries, list) or catalog.get('has_more') is not False\n            or catalog.get('page') != 1 or catalog.get('total') != len(entries)):\n        raise GenerationError('INCOMPLETE_KNOWLEDGE_CATALOG')\n    controlled = {d['document_id']: d for d in manifest['documents']}\n    if len(controlled) != len(manifest['documents']): raise ValueError('duplicate registry')\n    current, families, signatures, seen = {}, {}, [], set()\n    for entry in entries:\n        if entry['id'] in seen: raise ValueError('duplicate identity')\n        seen.add(entry['id'])\n        raw = entry['doc_metadata']\n        if not isinstance(raw, list): raise ValueError('metadata missing')\n        meta = {item['name']: item['value'] for item in raw}\n        if len(meta) != len(raw): raise ValueError('duplicate metadata')\n        signatures.append({k: entry.get(k) for k in ('id', 'name', 'enabled', 'archived', 'indexing_status', 'doc_metadata')})\n        if entry.get('enabled') is not True or entry.get('archived') is not False: continue\n        if meta.get('status') in ('expired', 'revoked', 'inactive', 'future'): continue\n        required = ('document_id', 'controlled_document_name', 'source_key', 'status', 'scope', 'version',\n            'effective_date', 'effective_from', 'effective_until', 'steel_grade', 'process_stage',\n            'rule_id', 'chapter', 'section', 'parameters', 'directions', 'content_sha256')\n        if any(meta.get(k) in (None, '') for k in required): raise ValueError('missing metadata')\n        start, end = metadata_epoch(meta['effective_from']), metadata_epoch(meta['effective_until'])\n        if start >= end or metadata_epoch(meta['effective_date']) != start: raise ValueError('dates')\n        if not start <= timestamp(as_of).timestamp() < end: continue\n        if meta['status'] != 'active': raise ValueError('status')\n        if (meta['scope'], meta['steel_grade'], meta['process_stage']) != ('DEMO-LINE-A', 'DEMO-A', 'review'):\n            if entry['id'] in controlled: raise ValueError('controlled scope changed')\n            continue\n        families.setdefault(meta['controlled_document_name'], []).append(entry['id'])\n        current[entry['id']] = (entry, meta)\n    if any(len(ids) != 1 for ids in families.values()): raise ValueError('VERSION_CONFLICT')\n    for doc_id, (entry, meta) in current.items():\n        document = controlled.get(doc_id)\n        if not document or entry['indexing_status'] != 'completed': raise ValueError('UNCONTROLLED_CURRENT_SOURCE')\n        expected = controlled_fixture_hit(document)['metadata']['doc_metadata']\n        if entry['name'] != document['source_file_name'] or any(meta.get(k) != v for k, v in expected.items()):\n            raise ValueError('CATALOG_METADATA_MISMATCH')\n    fingerprint = hashlib.sha256(json.dumps(sorted(signatures, key=lambda s: s['id']),\n        ensure_ascii=False, sort_keys=True).encode()).hexdigest()\n    return set(current), fingerprint\n\n\ndef qa_catalog(previous, status_code, body, manifest):\n    result = strict_json(previous)\n    try:\n        _, fingerprint = qa_catalog_view(status_code, body, manifest, result['as_of'])\n        result['catalog_fingerprint'] = fingerprint\n        return qa_packet(result, 'retrieve')\n    except GenerationError as exc: return qa_stop(result, str(exc), True)\n    except (ValueError, KeyError, TypeError, AttributeError, OverflowError):\n        return qa_stop(result, 'INVALID_OR_CONFLICTING_CATALOG')\n\n\ndef qa_embedding_health(previous, status_code, body):\n    \"\"\"A real model call prevents swallowed SDK failures becoming 'no evidence'.\"\"\"\n    try:\n        if status_code != 200: raise ValueError('embedding transport')\n        data = strict_json(body)\n        vectors = data['embeddings']\n        if data['model'] != 'qwen3-embedding:0.6b' or not isinstance(vectors,list) or len(vectors)!=1:\n            raise ValueError('embedding contract')\n        vector = vectors[0]\n        if not isinstance(vector,list) or len(vector)!=1024 or any(type(v) not in (int,float) or not math.isfinite(v) for v in vector):\n            raise ValueError('embedding dimension/type')\n        return qa_packet(strict_json(previous),'canary')\n    except (ValueError,KeyError,TypeError):\n        return qa_stop(previous,'EMBEDDING_UNAVAILABLE_OR_INVALID',True)\n\n\ndef qa_retrieval_health(previous, hits, manifest):\n    \"\"\"Independent known-corpus canary, never used as answer evidence/citations.\"\"\"\n    try:\n        if not isinstance(hits,list) or not hits: raise ValueError('retrieval unavailable')\n        result = strict_json(previous)\n        for hit in hits:\n            identity = hit['metadata']['document_id']\n            docs = [d for d in manifest['documents'] if d['document_id']==identity]\n            if len(docs)!=1: raise ValueError('unverified canary')\n            source, reason = verify_controlled_hit(hit,docs[0])\n            if reason or docs[0]['status']!='active' or not timestamp(docs[0]['effective_from'])<=timestamp(result['as_of'])<timestamp(docs[0]['effective_until']):\n                raise ValueError('unverified canary')\n        return qa_packet(result,'retrieve')\n    except (ValueError,KeyError,TypeError,AttributeError):\n        return qa_stop(previous,'KNOWLEDGE_RETRIEVAL_UNAVAILABLE',True)\n\n\ndef qa_plan(kind, documents):\n    by_key = {d['chunk_id']: d for d in documents}\n    keys = ['temperature'] if kind == 'temperature' else ['chemistry'] if kind == 'chemistry' else ['temperature', 'chemistry'] if kind in ('both', 'roles') else ['temperature'] if kind == 'partial' else []\n    plan = []\n    for key in keys:\n        doc = by_key['DEMO-CHECK-' + key + '-v1']\n        quotes = doc['checks'][-1:] if kind == 'roles' else doc['checks']\n        for quote in quotes: plan.append((doc['document_id'], quote))\n    return plan\n\n\ndef qa_render(points, applicability, human):\n    return '\\n'.join([p['text'] + ' ' + ' '.join('[cite:' + c + ']' for c in p['citation_ids']) for p in points]\n        + [applicability, human])\n\n\ndef qa_evidence(previous, hits, status_code, body, manifest):\n    result = strict_json(previous)\n    try:\n        current, fingerprint = qa_catalog_view(status_code, body, manifest, result['as_of'])\n        if fingerprint != result['catalog_fingerprint']: raise ValueError('catalog changed')\n        if not isinstance(hits, list): return qa_stop(result, 'INVALID_RETRIEVAL_RESPONSE', True)\n        if not hits: return qa_stop(result, 'NO_EVIDENCE')\n        verified, source_ids = {}, set()\n        for hit in hits:\n            identity = hit.get('metadata', {}).get('document_id') if isinstance(hit, dict) else None\n            docs = [d for d in manifest['documents'] if d['document_id'] == identity]\n            if len(docs) != 1: raise ValueError('uncontrolled retrieval source')\n            source, reason = verify_controlled_hit(hit, docs[0])\n            if reason or identity not in current or source['segment_id'] in source_ids: raise ValueError(reason or 'inactive/duplicate hit')\n            source_ids.add(source['segment_id'])\n            verified[identity] = source\n        plan = qa_plan(result['question_kind'], manifest['documents'])\n        if not plan: return qa_stop(result, 'NO_REVIEWED_DIRECT_SUPPORT')\n        covered = [quote for identity, quote in plan if identity in verified and quote in verified[identity]['quote']]\n        if len(covered) != len(plan) or result['question_kind'] == 'partial':\n            return qa_stop(result, 'INCOMPLETE_DIRECT_SUPPORT', covered=['已有核查要点' ] if covered else [])\n        citations, points, by_doc = [], [], {}\n        for doc_id, quote in plan:\n            source = verified[doc_id]\n            if doc_id not in by_doc:\n                citation = {k: source[k] for k in SOURCE_SCHEMA['properties'] if k != 'citation_id' and k != 'scope'}\n                citation['scope'] = next(h['metadata']['doc_metadata']['scope'] for h in hits if h['metadata']['document_id'] == doc_id)\n                citation['citation_id'] = stable_id('cite_', [result['request_id'], source])\n                citations.append(citation); by_doc[doc_id] = citation['citation_id']\n            points.append({'claim_id': stable_id('qa_', [result['request_id'], doc_id, quote]),\n                'text': quote, 'citation_ids': [by_doc[doc_id]]})\n        generation = {'answer': qa_render(points, QA_BOUNDARY, QA_HUMAN), 'supported_points': points,\n            'citations': citations, 'applicability': QA_BOUNDARY, 'human_confirmation': QA_HUMAN}\n        validate_schema(generation, QA_SCHEMA)\n        result.update(status='evidence_verified', code='DIRECT_ENTERPRISE_EVIDENCE')\n        return qa_packet(result, 'generate', json.dumps(generation, ensure_ascii=False))\n    except GenerationError as exc: return qa_stop(result, str(exc), True)\n    except (ValueError, KeyError, TypeError, AttributeError, OverflowError):\n        return qa_stop(result, 'UNVERIFIED_OR_INAPPLICABLE_EVIDENCE')\n\n\ndef qa_generation(previous, hits, status_code, body, text, native, finish_reason, reasoning, manifest):\n    try:\n        rebuilt = qa_evidence(previous, hits, status_code, body, manifest)\n        if rebuilt['state'] != 'generate': return rebuilt\n        expected = strict_json(rebuilt['payload'])\n        if finish_reason not in ('stop', 'end_turn'): return qa_stop(previous, 'GENERATION_TRUNCATED', True)\n        output, tagged = parse_model_text(text)\n        validate_schema(output, QA_SCHEMA)\n        if native is not None:\n            validate_schema(native, QA_SCHEMA)\n            if native != output: return qa_stop(previous, 'NATIVE_TEXT_MISMATCH', True)\n        if not isinstance(reasoning, str): return qa_stop(previous, 'INVALID_REASONING', True)\n        if re.search(r'\\[cite:|citation_id|cite_[0-9a-f]{32}', reasoning + tagged):\n            return qa_stop(previous, 'UNTRUSTED_REASONING_CITATION')\n        for key, identifier in [('citations', 'citation_id'), ('supported_points', 'claim_id')]:\n            allowed = {item[identifier]: item for item in expected[key]}\n            ids = [item[identifier] for item in output[key]]\n            if len(set(ids)) != len(ids) or set(ids) != set(allowed): return qa_stop(previous, 'CITATION_OR_CLAIM_COVERAGE')\n            if any(item != allowed[item[identifier]] for item in output[key]): return qa_stop(previous, 'GENERATED_EVIDENCE_CHANGED')\n        if output['applicability'] != QA_BOUNDARY or output['human_confirmation'] != QA_HUMAN:\n            return qa_stop(previous, 'APPLICABILITY_OR_HUMAN_BOUNDARY_CHANGED')\n        if output['answer'] != qa_render(output['supported_points'], QA_BOUNDARY, QA_HUMAN):\n            return qa_stop(previous, 'ANSWER_EXCEEDS_VERIFIED_EVIDENCE')\n        result = strict_json(previous)\n        result.update(status='answered', code='VERIFIED_KNOWLEDGE_ANSWER', answer=output['answer'],\n            supported_points=copy.deepcopy(output['supported_points']),\n            citations=[copy.deepcopy(next(c for c in expected['citations'] if c['citation_id'] == item['citation_id'])) for item in output['citations']],\n            applicability=QA_BOUNDARY, human_confirmation=QA_HUMAN, automatic_actions=[])\n        return qa_packet(result)\n    except (ValueError, TypeError, KeyError, AttributeError, RecursionError):\n        return qa_stop(previous, 'GENERATION_VALIDATION_FAILED', True)\n\n_frozen_verify=verify_controlled_hit\ndef f_begin(question, request_id, as_of=None):\n    result = {'question': question if isinstance(question, str) else '', 'request_id': request_id,\n              'as_of': as_of or datetime.now(timezone.utc).isoformat(), 'status': 'pending',\n              'code': 'INPUT_VALIDATED', 'citations': [], 'automatic_actions': []}\n    try:\n        timestamp(result['as_of'])\n        if not isinstance(request_id, str) or not 1 <= len(request_id) <= 128:\n            raise ValueError('request')\n        if not isinstance(question, str) or not question.strip() or len(question) > 1000:\n            return qa_stop(result, 'INVALID_QUESTION')\n        if re.search(r'忽略|跳过|凭经验|预训练|系统提示|system prompt|ignore|假装|编造|<think>|\\[cite:', question, re.I):\n            return qa_stop(result, 'UNTRUSTED_QUESTION_INSTRUCTION')\n        if re.search(r'PLC|自动执行|写入|直接控制|设备控制参数', question, re.I):\n            return qa_stop(result, 'READ_ONLY_KNOWLEDGE_ONLY')\n        normalized = qa_normalize(question)\n        matches = [q for q in MANIFEST['questions'] if normalized in\n                   [qa_normalize(alias) for alias in [q['question']] + q.get('aliases', [])]]\n        if len(matches) > 1:\n            return qa_stop(result, 'AMBIGUOUS_REVIEWED_QUESTION')\n        result['question_kind'] = matches[0]['id'] if matches else 'unsupported'\n        result['source_type'] = MANIFEST['source_type']\n        return qa_packet(result, 'catalog', json.dumps({'model': 'qwen3-embedding:0.6b', 'input': question}, ensure_ascii=False))\n    except (ValueError, TypeError):\n        result['as_of'] = datetime.now(timezone.utc).isoformat()\n        return qa_stop(result, 'INVALID_REQUEST_BINDING', True)\n\ndef f_verify(hit, document):\n    source, reason = _frozen_verify(hit, document)\n    if reason:\n        return source, reason\n    metadata = hit['metadata']['doc_metadata']\n    if any(metadata.get(k) != document.get(k) for k in EXTRA_FIELDS):\n        return None, 'SOURCE_TRUST_LAYER_MISMATCH'\n    if metadata['source_type'] != MANIFEST['source_type']:\n        return None, 'SOURCE_TRUST_LAYER_MISMATCH'\n    # These values come directly from the verified retrieval hit, never an LLM.\n    source.update({key: metadata[key] for key in EXTRA_FIELDS})\n    return source, None\n\ndef f_catalog_view(status_code, body, manifest, as_of):\n    if status_code != 200:\n        raise GenerationError('KNOWLEDGE_CATALOG_FAILURE')\n    catalog = strict_json(body)\n    entries = catalog['data']\n    if not isinstance(entries, list) or catalog.get('has_more') is not False or catalog.get('page') != 1 or catalog.get('total') != len(entries):\n        raise GenerationError('INCOMPLETE_KNOWLEDGE_CATALOG')\n    controlled = {d['document_id']: d for d in manifest['documents']}\n    if len(controlled) != len(manifest['documents']) or set(controlled) != {e['id'] for e in entries}:\n        raise ValueError('catalog membership differs from controlled index')\n    current, families, signatures, seen = set(), {}, [], set()\n    for entry in entries:\n        if entry['id'] in seen:\n            raise ValueError('duplicate identity')\n        seen.add(entry['id'])\n        raw = entry['doc_metadata']\n        if not isinstance(raw, list):\n            raise ValueError('missing metadata')\n        meta = {item['name']: item['value'] for item in raw}\n        if len(meta) != len(raw):\n            raise ValueError('duplicate metadata')\n        document = controlled[entry['id']]\n        expected = controlled_fixture_hit(document)['metadata']['doc_metadata']\n        expected.update({k: document[k] for k in EXTRA_FIELDS})\n        if entry['name'] != document['source_file_name'] or any(meta.get(k) != value for k, value in expected.items()):\n            raise ValueError('catalog metadata changed or missing')\n        signatures.append({k: entry.get(k) for k in ('id', 'name', 'enabled', 'archived', 'indexing_status', 'doc_metadata')})\n        start, end = metadata_epoch(meta['effective_from']), metadata_epoch(meta['effective_until'])\n        if start >= end or metadata_epoch(meta['effective_date']) != start:\n            raise ValueError('invalid dates')\n        if entry.get('enabled') is not True or entry.get('archived') is not False:\n            continue\n        if meta['status'] in ('expired', 'revoked', 'inactive', 'future'):\n            continue\n        if meta['status'] != 'active' or entry['indexing_status'] != 'completed':\n            raise ValueError('source unavailable')\n        if not start <= timestamp(as_of).timestamp() < end:\n            continue\n        if meta['source_type'] != manifest['source_type']:\n            raise ValueError('wrong trust layer')\n        families.setdefault(meta['controlled_document_name'], []).append(entry['id'])\n        current.add(entry['id'])\n    if any(len(ids) != 1 for ids in families.values()):\n        raise ValueError('VERSION_CONFLICT')\n    fingerprint = hashlib.sha256(json.dumps(sorted(signatures, key=lambda s: s['id']), ensure_ascii=False, sort_keys=True).encode()).hexdigest()\n    return current, fingerprint\n\ndef f_plan(kind, documents):\n    questions = [q for q in MANIFEST['questions'] if q['id'] == kind]\n    if len(questions) != 1 or questions[0].get('expected') != 'answered':\n        return []\n    by_key = {d['chunk_id']: d for d in documents if d['status'] == 'active'}\n    return [(by_key[key]['document_id'], quote) for key in questions[0]['source_keys'] for quote in by_key[key]['checks']]\nEXTRA_FIELDS=('source_type', 'department', 'steel_grade_scope', 'url')\nMANIFEST={'source_type': 'PUBLIC_REFERENCE', 'documents': [{'chunk_id': 'F-PUBLIC-01', 'source_file_name': 'F-PUBLIC-01.txt', 'document_name': '转炉时间公开参考摘要', 'version': '2026-10-03', 'status': 'active', 'effective_date': '2026-01-01', 'effective_from': '2026-01-01T00:00:00+00:00', 'effective_until': '2030-01-01T00:00:00+00:00', 'scope': 'PUBLIC-REFERENCE', 'department': 'World Steel Association', 'process_stage': 'management', 'steel_grade': 'DEMO-ALL', 'steel_grade_scope': 'DEMO-ALL', 'rule_id': 'F-KNOWLEDGE-REVIEW', 'parameters': ['knowledge'], 'directions': ['reference'], 'chapter': '公开资料改述摘要', 'section': '主题要点', 'page': None, 'content': '转炉时间公开参考摘要\\n\\n来源类型：公开行业参考。以下为经核对的简短中文改述，不是原文转载，不代表企业制度。\\n\\nworldsteel的历史介绍列举现代转炉可将最多350吨铁料在不足40分钟内转为钢的例子。\\n\\n这个公开例子不是所有钢种和工厂的完整生产周期，不能作为本演示企业的合格时长标准。\\n\\n原始公开来源：https://worldsteel.org/about-steel/steel-story/\\n访问日期：2026-10-03。适用边界：仅供一般行业知识参考；不用于企业规则和设备控制。', 'checks': ['worldsteel的历史介绍列举现代转炉可将最多350吨铁料在不足40分钟内转为钢的例子。', '这个公开例子不是所有钢种和工厂的完整生产周期，不能作为本演示企业的合格时长标准。'], 'content_sha256': '371b42828f080577515879c9e07b512a43d6885e49116307d6c6fce28f9670c6', 'source_type': 'PUBLIC_REFERENCE', 'url': 'https://worldsteel.org/about-steel/steel-story/', 'questions': ['一般来说转炉炼钢一炉需要多久？', '公开资料如何描述现代转炉的炼钢时间？'], 'authoring_file_name': 'F-PUBLIC-01.md', 'dataset_id': '795e440f-f6f8-4cf6-bb00-32514345eb6d', 'document_id': '62209445-4e18-4aa2-a566-dcbe86b76aae', 'segment_id': '27adc818-46f9-4b41-81f6-5c08cbdcaf63'}, {'chunk_id': 'F-PUBLIC-02', 'source_file_name': 'F-PUBLIC-02.txt', 'document_name': '炼钢路线与回收公开参考摘要', 'version': '2026-10-03', 'status': 'active', 'effective_date': '2026-01-01', 'effective_from': '2026-01-01T00:00:00+00:00', 'effective_until': '2030-01-01T00:00:00+00:00', 'scope': 'PUBLIC-REFERENCE', 'department': 'World Steel Association', 'process_stage': 'management', 'steel_grade': 'DEMO-ALL', 'steel_grade_scope': 'DEMO-ALL', 'rule_id': 'F-KNOWLEDGE-REVIEW', 'parameters': ['knowledge'], 'directions': ['reference'], 'chapter': '公开资料改述摘要', 'section': '主题要点', 'page': None, 'content': '炼钢路线与回收公开参考摘要\\n\\n来源类型：公开行业参考。以下为经核对的简短中文改述，不是原文转载，不代表企业制度。\\n\\nworldsteel介绍高炉—转炉和电弧炉两类主要炼钢路线；路线的原料与供能方式存在差别。\\n\\n电弧炉主要使用回收钢和电力，按工厂条件也可使用直接还原铁或铁水。\\n\\n钢可以反复回收利用；这些一般性介绍不提供本企业任何炉次状态或物料配方。\\n\\n原始公开来源：https://worldsteel.org/about-steel/what-is%20steel/\\n访问日期：2026-10-03。适用边界：仅供一般行业知识参考；不用于企业规则和设备控制。', 'checks': ['worldsteel介绍高炉—转炉和电弧炉两类主要炼钢路线；路线的原料与供能方式存在差别。', '电弧炉主要使用回收钢和电力，按工厂条件也可使用直接还原铁或铁水。', '钢可以反复回收利用；这些一般性介绍不提供本企业任何炉次状态或物料配方。'], 'content_sha256': '328f6a8d172f37def63a71e7eafd758ff8109b940e602c92efd533093dc7d290', 'source_type': 'PUBLIC_REFERENCE', 'url': 'https://worldsteel.org/about-steel/what-is%20steel/', 'questions': ['行业中主要有哪些炼钢路线？', '一般电弧炉主要使用什么原料和能源？', '公开资料中电弧炉可以用直接还原铁吗？', '行业中钢可以重复回收吗？'], 'authoring_file_name': 'F-PUBLIC-02.md', 'dataset_id': '795e440f-f6f8-4cf6-bb00-32514345eb6d', 'document_id': '575af8f1-cd6a-4342-9047-a7c530d0681a', 'segment_id': 'fa381ace-b9ef-45ba-ba73-18301f50277a'}, {'chunk_id': 'F-PUBLIC-03', 'source_file_name': 'F-PUBLIC-03.txt', 'document_name': '钢铁制造流程公开参考摘要', 'version': '2026-10-03', 'status': 'active', 'effective_date': '2026-01-01', 'effective_from': '2026-01-01T00:00:00+00:00', 'effective_until': '2030-01-01T00:00:00+00:00', 'scope': 'PUBLIC-REFERENCE', 'department': 'World Steel Association', 'process_stage': 'management', 'steel_grade': 'DEMO-ALL', 'steel_grade_scope': 'DEMO-ALL', 'rule_id': 'F-KNOWLEDGE-REVIEW', 'parameters': ['knowledge'], 'directions': ['reference'], 'chapter': '公开资料改述摘要', 'section': '主题要点', 'page': None, 'content': '钢铁制造流程公开参考摘要\\n\\n来源类型：公开行业参考。以下为经核对的简短中文改述，不是原文转载，不代表企业制度。\\n\\nworldsteel流程图展示原料准备、炼铁、炼钢、精炼、连铸、热轧和后续精整等生产环节。\\n\\n图中连铸位于炼钢和精炼之后、热轧之前，示意产品包含方坯和板坯等半成品。\\n\\n流程图将炉渣列为副产品，并示意水泥与骨料等用途；不代表任何具体炉渣批次获得使用许可。\\n\\n原始公开来源：https://worldsteel.org/wp-content/uploads/steelmaking-process.pdf\\n访问日期：2026-10-03。适用边界：仅供一般行业知识参考；不用于企业规则和设备控制。', 'checks': ['worldsteel流程图展示原料准备、炼铁、炼钢、精炼、连铸、热轧和后续精整等生产环节。', '图中连铸位于炼钢和精炼之后、热轧之前，示意产品包含方坯和板坯等半成品。', '流程图将炉渣列为副产品，并示意水泥与骨料等用途；不代表任何具体炉渣批次获得使用许可。'], 'content_sha256': '46ef317cb86f9f96c0e376347d6a2883316f7b68c6266333721ae502bca27150', 'source_type': 'PUBLIC_REFERENCE', 'url': 'https://worldsteel.org/wp-content/uploads/steelmaking-process.pdf', 'questions': ['公开资料中钢铁制造有哪些环节？', '行业流程图中连铸位于哪个阶段？', '公开资料中炉渣有哪些示意用途？'], 'authoring_file_name': 'F-PUBLIC-03.md', 'dataset_id': '795e440f-f6f8-4cf6-bb00-32514345eb6d', 'document_id': '6fc3205b-8002-4e08-bb97-4e744ee1b0c6', 'segment_id': '4ae27a57-e924-4e8c-bf51-093b8cfb67bd'}, {'chunk_id': 'F-PUBLIC-04', 'source_file_name': 'F-PUBLIC-04.txt', 'document_name': 'MES作用与系统协同公开案例摘要', 'version': '2026-10-03', 'status': 'active', 'effective_date': '2026-01-01', 'effective_from': '2026-01-01T00:00:00+00:00', 'effective_until': '2030-01-01T00:00:00+00:00', 'scope': 'PUBLIC-REFERENCE', 'department': '国家市场监督管理总局计量司', 'process_stage': 'management', 'steel_grade': 'DEMO-ALL', 'steel_grade_scope': 'DEMO-ALL', 'rule_id': 'F-KNOWLEDGE-REVIEW', 'parameters': ['knowledge'], 'directions': ['reference'], 'chapter': '公开资料改述摘要', 'section': '主题要点', 'page': None, 'content': 'MES作用与系统协同公开案例摘要\\n\\n来源类型：公开行业参考。以下为经核对的简短中文改述，不是原文转载，不代表企业制度。\\n\\n市场监管总局的公开案例把MES描述为面向车间执行层的生产信息化管理系统，涉及生产、质量和制造数据等管理。\\n\\n案例说明实时信息采集与反馈有助于制造过程透明化，并介绍MES、ERP和PLM的信息协同。\\n\\n该案例来自特种计算机制造，不是钢厂内部SOP，也不能证明本演示企业某个对象的数据或绩效。\\n\\n原始公开来源：https://www.samr.gov.cn/jls/zt/jlfwzxqy/qyal/art/2023/art_28a057a295d14e99a5acd959f59d1c2a.html\\n访问日期：2026-10-03。适用边界：仅供一般行业知识参考；不用于企业规则和设备控制。', 'checks': ['市场监管总局的公开案例把MES描述为面向车间执行层的生产信息化管理系统，涉及生产、质量和制造数据等管理。', '案例说明实时信息采集与反馈有助于制造过程透明化，并介绍MES、ERP和PLM的信息协同。', '该案例来自特种计算机制造，不是钢厂内部SOP，也不能证明本演示企业某个对象的数据或绩效。'], 'content_sha256': 'efc2e281725638fc0ab9523d98548861f108b28f59320ca5a3defa15dc392bab', 'source_