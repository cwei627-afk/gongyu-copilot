    - data:
        code: "\"\"\"Extract the terminal turn from official strategy records, not\
          \ text braces.\"\"\"\nimport json\nimport re\n\n\ndef terminal_payload(capability,\
          \ agent_log):\n    try:\n        if not isinstance(agent_log, list): raise\
          \ ValueError('log shape')\n        rounds = [item for item in agent_log\
          \ if isinstance(item, dict)\n                  and isinstance(item.get('label'),\
          \ str) and item['label'].startswith('ROUND ')]\n        if not 1 <= len(rounds)\
          \ <= 6 or [item['label'] for item in rounds] != [f'ROUND {i+1}' for i in\
          \ range(len(rounds))]:\n            raise ValueError('missing/duplicate/out-of-order\
          \ round')\n        if any(item.get('node_id') != 'readonly_agent' or item.get('parent_id')\
          \ is not None\n               or item.get('status') != 'success' or item.get('error')\
          \ is not None for item in rounds):\n            raise ValueError('untrusted\
          \ execution record')\n        final = rounds[-1]['data']['output']\n   \
          \     if final['tool_responses'] != [] or not isinstance(final['llm_response'],\
          \ str):\n            raise ValueError('no terminal model turn')\n      \
          \  return {'payload': json.dumps({'capability': capability, 'text': final['llm_response']},\
          \ ensure_ascii=False)}\n    except (ValueError, KeyError, TypeError):\n\
          \        return {'payload': json.dumps({'capability': capability, 'text':\
          \ '{}', 'execution_failed': True})}\n\ndef main(capability,agent_log):\n\
          \    return terminal_payload(capability,agent_log)\n"
