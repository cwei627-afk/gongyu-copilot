            "code_language": "python3",
            "code": "\"\"\"Pure standard-library Code node functions, shared by Dify DSL and local tests.\n\nNo HTTP, SQL, vector search or LLM execution lives here. The workflow supplies responses.\n\"\"\"\nimport json\nimport hashlib\nimport math\nimport re\nfrom datetime import datetime, timezone\nfrom urllib.parse import quote\n\nFIELDS = {\"temperature\": [\"temperature_c\"], \"chemistry\": [\"carbon_pct\", \"silicon_pct\", \"manganese_pct\"],\n          \"all\": [\"temperature_c\", \"carbon_pct\", \"silicon_pct\", \"manganese_pct\"]}\nUNITS = {\"temperature_c\": \"°C\", \"carbon_pct\": \"%\", \"silicon_pct\": \"%\", \"manganese_pct\": \"%\"}\n\n\ndef packet(result, state=\"end\", query=\"\"):\n    context = result.get(\"data_used\") if isinstance(result.get(\"data_used\"), dict) else {}\n    heat = context.get(\"heat\") if isinstance(context.get(\"heat\"), dict) else {}\n    rule = context.get(\"rule\") if isinstance(context.get(\"rule\"), dict) else {}\n    effective_at_epoch = 0.0\n    try:\n        if context.get(\"snapshot_at\"):\n            effective_at_epoch = timestamp(context[\"snapshot_at\"]).timestamp()\n    except (TypeError, ValueError, AttributeError, OverflowError):\n        effective_at_epoch = 0.0\n    return {\n        \"state\": state,\n        \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False),\n        \"query\": query,\n        \"heat_id_encoded\": quote(result.get(\"heat_id\", \"\"), safe=\"\"),\n        \"scope\": context.get(\"scope\", \"\"),\n        \"steel_grade\": heat.get(\"steel_grade\", \"\"),\n        \"process_stage\": context.get(\"process_stage\", \"\"),\n        \"rule_id\": rule.get(\"rule_id\", \"\"),\n        \"effective_at_epoch\": effective_at_epoch,\n    }\n\n\ndef stop(result, category, code, message):\n    result.update(status=category + \"_error\", category=category, code=code, message=message,\n                  suggested_checks=[], sources=[])\n    return packet(result)\n\n\ndef begin(heat_id, analysis_request):\n    result = {\"heat_id\": heat_id if isinstance(heat_id, str) else \"\", \"analysis_request\": analysis_request,\n              \"status\": \"pending\", \"category\": None, \"code\": None, \"message\": \"\",\n              \"process_anomaly_confirmed\": None, \"anomaly_facts\": [], \"data_used\": {},\n              \"business_rules\": [], \"suggested_checks\": [], \"sources\": [], \"automatic_actions\": [],\n              \"human_confirmation\": \"涉及生产处置必须由授权人员人工复核确认；本结果不控制 PLC 或设备。\",\n              \"trace\": [\"validate_input\"]}\n    if (not isinstance(heat_id, str) or not 1 <= len(heat_id) <= 128\n            or re.search(r\"[\\s\\x00-\\x1f\\x7f/]\", heat_id) or analysis_request not in FIELDS):\n        return stop(result, \"request\", \"INVALID_PARAMETER\", \"提供有效 heat_id，并选择 temperature、chemistry 或 all。\")\n    return packet(result, \"continue\")\n\n\ndef http_body(result, status_code, body):\n    \"\"\"Return parsed data or a terminal packet. Never infer facts from transport failure.\"\"\"\n    if status_code in (401, 403) or status_code >= 500 or status_code <= 0 or status_code == 429:\n        return None, stop(result, \"system\", \"UPSTREAM_TIMEOUT\" if status_code == 504 else \"UPSTREAM_FAILURE\",\n                          \"业务系统调用失败，不能据此判断炉次存在性或工艺状态。\")\n    try:\n        data = json.loads(body)\n        if not isinstance(data, dict):\n            raise ValueError(\"not an object\")\n    except (ValueError, TypeError):\n        return None, stop(result, \"system\", \"INVALID_RESPONSE\", \"业务系统返回了无效响应。\")\n    if status_code != 200:\n        error = data.get(\"error\", {})\n        valid = (status_code == 404 and error.get(\"category\") == \"data\" and error.get(\"code\") == \"OBJECT_NOT_FOUND\"\n                 or status_code == 409 and error.get(\"category\") == \"data\"\n                 or status_code == 422 and error.get(\"category\") == \"request\")\n        if valid:\n            return None, stop(result, error[\"category\"], error.get(\"code\", \"INVALID_DATA\"),\n                              \"源系统确认对象不存在或数据/参数不可用，停止工艺推断。\")\n        return None, stop(result, \"system\", \"INVALID_RESPONSE\", \"未识别的接口失败语义，停止推断。\")\n    return data, None\n\n\ndef inspect_heat(previous, status_code, body):\n    result = json.loads(previous)\n    result[\"trace\"].append(\"query_heat\")\n    heat, terminal = http_body(result, status_code, body)\n    if terminal:\n        return terminal\n    if (heat.get(\"heat_id\") != result[\"heat_id\"]\n            or any(not isinstance(heat.get(k), str) or not heat[k].strip()\n                   for k in (\"steel_grade\", \"status\", \"updated_at\"))):\n        return stop(result, \"data\", \"INVALID_HEAT\", \"炉次身份或必要字段无效，停止推断。\")\n    result[\"data_used\"][\"initial_heat\"] = heat\n    return packet(result, \"continue\")\n\n\ndef timestamp(value):\n    parsed = datetime.fromisoformat(value.replace(\"Z\", \"+00:00\"))\n    if parsed.tzinfo is None:\n        raise ValueError(\"timezone required\")\n    return parsed\n\n\ndef finite_number(value):\n    if isinstance(value, bool) or not isinstance(value, (float, int)) or not math.isfinite(value):\n        raise ValueError(\"finite numeric value required\")\n    return value\n\n\ndef compare_context(previous, status_code, body):\n    result = json.loads(previous)\n    result[\"trace\"].append(\"query_context_and_rule\")\n    context, terminal = http_body(result, status_code, body)\n    if terminal:\n        return terminal\n    try:\n        heat, rule = context[\"heat\"], context[\"rule\"]\n        if heat != result[\"data_used\"][\"initial_heat\"]:\n            return stop(result, \"data\", \"SNAPSHOT_CHANGED\", \"两次查询之间炉次状态发生变化，请重新查询。\")\n        now, start = timestamp(context[\"snapshot_at\"]), timestamp(context[\"stage_started_at\"])\n        if not timestamp(rule[\"effective_from\"]) <= now < timestamp(rule[\"effective_until\"]):\n            return stop(result, \"data\", \"RULE_NOT_EFFECTIVE\", \"目标规则不在有效期内。\")\n        for key in (\"scope\", \"process_stage\"):\n            if not context[key] or context[key] != rule[key]:\n                return stop(result, \"data\", \"RULE_MISMATCH\", \"阶段或适用范围与规则不匹配。\")\n        if heat[\"steel_grade\"] != rule[\"steel_grade\"] or heat[\"status\"] != rule[\"required_status\"]:\n            return stop(result, \"data\", \"RULE_MISMATCH\", \"钢种或状态与规则不匹配。\")\n        age_limit = finite_number(rule[\"max_age_seconds\"])\n        if age_limit <= 0 or start > now:\n            raise ValueError(\"invalid freshness rule\")\n        if not 0 <= (now - timestamp(heat[\"updated_at\"])).total_seconds() <= age_limit:\n            return stop(result, \"data\", \"STALE_DATA\", \"炉次状态时间无效或已过期。\")\n        values = {}\n        for kind in (\"temperature\", \"chemistry\"):\n            measured = context[kind]\n            when = timestamp(measured[\"measured_at\"])\n            if measured[\"heat_id\"] != heat[\"heat_id\"]:\n                return stop(result, \"data\", \"HEAT_MISMATCH\", \"测量记录不属于该炉次。\")\n            if when < start or not 0 <= (now - when).total_seconds() <= age_limit:\n                return stop(result, \"data\", \"STALE_DATA\", \"测量来自前一阶段、未来或已过期。\")\n            for field in FIELDS[kind]:\n                values[field] = finite_number(measured[field])\n        # Validate every configured bound before any abnormality is emitted.\n        for field in FIELDS[\"all\"]:\n            limit = rule[\"limits\"][field]\n            if (finite_number(limit[\"minimum\"]) > finite_number(limit[\"maximum\"])\n                    or limit[\"unit\"] != UNITS[field]):\n                raise ValueError(\"invalid limits or units\")\n        if any(not rule[\"source\"].get(k) for k in\n               (\"document_name\", \"version\", \"effective_date\", \"chapter\", \"section\", \"page\")):\n            raise ValueError(\"rule provenance missing\")\n    except (KeyError, ValueError, TypeError, AttributeError, OverflowError):\n        return stop(result, \"data\", \"INVALID_CONTEXT\", \"实际数据或规则结构不完整/无效，停止工艺推断。\")\n\n    result[\"data_used\"] = context\n    result[\"business_rules\"] = [rule]\n    result[\"trace\"].append(\"compare_effective_limits\")\n    for field in FIELDS[result[\"analysis_request\"]]:\n        value, limit = values[field], rule[\"limits\"][field]\n        direction = \"low\" if value < limit[\"minimum\"] else \"high\" if value > limit[\"maximum\"] else None\n        if direction:\n            result[\"anomaly_facts\"].append({\"parameter\": field, \"actual\": value, \"unit\": limit[\"unit\"],\n                                            \"minimum\": limit[\"minimum\"], \"maximum\": limit[\"maximum\"],\n                                            \"direction\": direction, \"rule_id\": rule[\"rule_id\"]})\n    result[\"process_anomaly_confirmed\"] = bool(result[\"anomaly_facts\"])\n    if not result[\"anomaly_facts\"]:\n        result.update(status=\"no_anomaly\", category=None, code=\"WITHIN_EFFECTIVE_RULE\",\n                      message=\"本次所选参数在当前有效规则范围内；仅陈述已检查参数，不代表整炉质量合格。\")\n        return packet(result)\n    result.update(status=\"process_anomaly\", category=\"process\", code=\"RULE_VIOLATION\",\n                  message=\"已确认所选实测参数违反当前有效规则；尚未获得生产处置证据。\")\n    query = \" \".join([heat[\"steel_grade\"], context[\"scope\"], context[\"process_stage\"],\n                       \"异常检查项\", *[a[\"parameter\"] + \" \" + a[\"direction\"] for a in result[\"anomaly_facts\"]]])\n    return packet(result, \"retrieve\", query)\n\n\ndef sha256_text(value):\n    if not isinstance(value, str):\n        raise ValueError(\"text required\")\n    return hashlib.sha256(value.encode(\"utf-8\")).hexdigest()\n\n\ndef metadata_epoch(value):\n    if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value):\n        raise ValueError(\"metadata epoch required\")\n    return float(value)\n\n\ndef same_epoch(value, expected):\n    return abs(metadata_epoch(value) - timestamp(expected).timestamp()) < 0.001\n\n\ndef verify_controlled_hit(hit, document):\n    \"\"\"Validate one Dify hit against the provisioned controlled-source registry.\n\n    The returned citation is built only from the validated hit. Registry values are\n    used as equality constraints and never copied into a citation.\n    \"\"\"\n    required_registry = (\n        \"dataset_id\", \"document_id\", \"segment_id\", \"source_file_name\", \"document_name\",\n        \"version\", \"effective_date\", \"effective_from\", \"effective_until\", \"status\", \"scope\",\n        \"steel_grade\", \"process_stage\", \"rule_id\", \"chapter\", \"section\", \"chunk_id\",\n        \"content\", \"content_sha256\", \"checks\", \"parameters\", \"directions\",\n    )\n    if any(key not in document or document[key] in (None, \"\") for key in required_registry):\n        return None, \"MISSING_CONTROLLED_IDENTITY\"\n    if not isinstance(hit, dict) or not isinstance(hit.get(\"content\"), str):\n        return None, \"MISSING_SOURCE_IDENTITY\"\n    metadata = hit.get(\"metadata\")\n    if not isinstance(metadata, dict) or not isinstance(metadata.get(\"doc_metadata\"), dict):\n        return None, \"MISSING_SOURCE_IDENTITY\"\n    doc_metadata = metadata[\"doc_metadata\"]\n    required_hit = (\"dataset_id\", \"document_id\", \"segment_id\", \"document_name\")\n    required_doc_metadata = (\n        \"document_name\", \"document_id\", \"controlled_document_name\", \"source_key\", \"version\",\n        \"effective_date\", \"effective_from\", \"effective_until\", \"status\", \"scope\", \"steel_grade\",\n        \"process_stage\", \"rule_id\", \"chapter\", \"section\", \"parameters\", \"directions\", \"content_sha256\",\n    )\n    if any(metadata.get(key) in (None, \"\") for key in required_hit):\n        return None, \"MISSING_SOURCE_IDENTITY\"\n    if any(doc_metadata.get(key) in (None, \"\") for key in required_doc_metadata):\n        return None, \"MISSING_METADATA\"\n    if any(key in metadata and metadata[key] != doc_metadata[key]\n           for key in (\"version\", \"status\", \"scope\", \"effective_date\")):\n        return None, \"METADATA_MISMATCH\"\n    if (metadata[\"dataset_id\"] != document[\"dataset_id\"]\n            or metadata[\"document_id\"] != document[\"document_id\"]\n            or metadata[\"segment_id\"] != document[\"segment_id\"]\n            or metadata[\"document_name\"] != document[\"source_file_name\"]\n            or doc_metadata[\"document_name\"] != metadata[\"document_name\"]\n            or doc_metadata[\"document_id\"] != metadata[\"document_id\"]\n            or doc_metadata[\"controlled_document_name\"] != document[\"document_name\"]\n            or doc_metadata[\"source_key\"] != document[\"chunk_id\"]):\n        return None, \"SOURCE_IDENTITY_MISMATCH\"\n    try:\n        expected_page = document.get(\"page\")\n        if (doc_metadata[\"version\"] != document[\"version\"]\n                or doc_metadata[\"status\"] != document[\"status\"]\n                or doc_metadata[\"scope\"] != document[\"scope\"]\n                or doc_metadata[\"steel_grade\"] != document[\"steel_grade\"]\n                or doc_metadata[\"process_stage\"] != document[\"process_stage\"]\n                or doc_metadata[\"rule_id\"] != document[\"rule_id\"]\n                or doc_metadata[\"chapter\"] != document[\"chapter\"]\n                or doc_metadata[\"section\"] != document[\"section\"]\n                or doc_metadata[\"parameters\"] != \",\".join(document[\"parameters\"])\n                or doc_metadata[\"directions\"] != \",\".join(document[\"directions\"])\n                or doc_metadata.get(\"page\") != expected_page\n                or not same_epoch(doc_metadata[\"effective_date\"], document[\"effective_date\"] + \"T00:00:00+00:00\")\n                or not same_epoch(doc_metadata[\"effective_from\"], document[\"effective_from\"])\n                or not same_epoch(doc_metadata[\"effective_until\"], document[\"effective_until\"])):\n            return None, \"METADATA_MISMATCH\"\n    except (TypeError, ValueError, AttributeError, OverflowError):\n        return None, \"INVALID_METADATA\"\n    content_hash = sha256_text(hit[\"content\"])\n    if (content_hash != document[\"content_sha256\"]\n            or doc_metadata[\"content_sha256\"] != content_hash\n            or document[\"content\"] not in hit[\"content\"]):\n        return None, \"CONTENT_HASH_MISMATCH\"\n    citation = {\n        \"dataset_id\": metadata[\"dataset_id\"],\n        \"document_id\": metadata[\"document_id\"],\n        \"segment_id\": metadata[\"segment_id\"],\n        \"document_name\": metadata[\"document_name\"],\n        \"display_name\": doc_metadata[\"controlled_document_name\"],\n        \"version\": doc_metadata[\"version\"],\n        \"effective_date\": datetime.fromtimestamp(\n            metadata_epoch(doc_metadata[\"effective_date\"]), timezone.utc\n        ).date().isoformat(),\n        \"chapter\": doc_metadata[\"chapter\"],\n        \"section\": doc_metadata[\"section\"],\n        \"page\": doc_metadata.get(\"page\"),\n        \"chunk_id\": doc_metadata[\"source_key\"],\n        \"content_sha256\": content_hash,\n        \"quote\": hit[\"content\"],\n    }\n    return citation, None\n\n\ndef controlled_fixture_hit(document):\n    \"\"\"Create an explicit local-test hit; production Workflow receives Dify hits.\"\"\"\n    content = document[\"content\"]\n    return {\n        \"title\": document[\"source_file_name\"],\n        \"content\": content,\n        \"metadata\": {\n            \"dataset_id\": document[\"dataset_id\"],\n            \"document_id\": document[\"document_id\"],\n            \"segment_id\": document[\"segment_id\"],\n            \"document_name\": document[\"source_file_name\"],\n            \"doc_metadata\": {\n                \"document_name\": document[\"source_file_name\"],\n                \"document_id\": document[\"document_id\"],\n                \"controlled_document_name\": document[\"document_name\"],\n                \"source_key\": document[\"chunk_id\"],\n                \"version\": document[\"version\"],\n                \"effective_date\": timestamp(document[\"effective_date\"] + \"T00:00:00+00:00\").timestamp(),\n                \"effective_from\": timestamp(document[\"effective_from\"]).timestamp(),\n                \"effective_until\": timestamp(document[\"effective_until\"]).timestamp(),\n                \"status\": document[\"status\"],\n                \"scope\": document[\"scope\"],\n                \"steel_grade\": document[\"steel_grade\"],\n                \"process_stage\": document[\"process_stage\"],\n                \"rule_id\": document[\"rule_id\"],\n                \"chapter\": document[\"chapter\"],\n                \"section\": document[\"section\"],\n                \"page\": document.get(\"page\"),\n                \"parameters\": \",\".join(document[\"parameters\"]),\n                \"directions\": \",\".join(document[\"directions\"]),\n                \"content_sha256\": document[\"content_sha256\"],\n            },\n        },\n    }\n\n\ndef evidence_decision(previous, retrieval_result, manifest, retrieval_failed=False):\n    \"\"\"Finite, pre-reviewed demo checklist mapping, NOT arbitrary semantic entailment.\n\n    Only exact controlled passages that support each confirmed deviation can pass.\n    User input and retrieval score cannot supply rules, quotes or equipment commands.\n    \"\"\"\n    result = json.loads(previous)\n    result[\"trace\"].append(\"retrieve_and_validate_evidence\")\n    if result.get(\"status\") != \"process_anomaly\":\n        return stop(result, \"system\", \"INVALID_TRANSITION\", \"无已确认工艺异常，不得进入建议分支。\")\n    if retrieval_failed:\n        return stop(result, \"system\", \"RETRIEVAL_FAILED\", \"已确认异常事实，但知识检索失败；不能生成处置建议，请人工确认。\")\n    missing, sources, checks = [], [], []\n    try:\n        if not isinstance(retrieval_result, list):\n            raise ValueError(\"invalid retrieval result\")\n        context = result[\"data_used\"]\n        as_of = timestamp(context[\"snapshot_at\"])\n        # Every returned hit must have a verifiable current source, including\n        # extra hits that do not support this particular deviation.\n        for hit in retrieval_result:\n            metadata = hit.get(\"metadata\", {}) if isinstance(hit, dict) else {}\n            document_id = metadata.get(\"document_id\") if isinstance(metadata, dict) else None\n            registered = [d for d in manifest[\"documents\"] if d.get(\"document_id\") == document_id]\n            if len(registered) != 1:\n                missing.append(\"UNVERIFIED_RETRIEVAL_SOURCE\")\n                continue\n            document = registered[0]\n            citation, reason = verify_controlled_hit(hit, document)\n            if reason:\n                missing.append(reason)\n            elif (document[\"status\"] != \"active\"\n                  or not timestamp(document[\"effective_from\"]) <= as_of < timestamp(document[\"effective_until\"])\n                  or document[\"scope\"] != context[\"scope\"]\n                  or document[\"steel_grade\"] != context[\"heat\"][\"steel_grade\"]\n                  or document[\"process_stage\"] != context[\"process_stage\"]\n                  or document[\"rule_id\"] != context[\"rule\"][\"rule_id\"]):\n                missing.append(\"INAPPLICABLE_RETRIEVAL_SOURCE\")\n        for anomaly in result[\"anomaly_facts\"]:\n            relevant = [d for d in manifest[\"documents\"]\n                        if d.get(\"scope\") == context[\"scope\"]\n                        and d.get(\"steel_grade\") == context[\"heat\"][\"steel_grade\"]\n                        and d.get(\"process_stage\") == context[\"process_stage\"]\n                        and anomaly[\"parameter\"] in d.get(\"parameters\", [])\n                        and anomaly[\"direction\"] in d.get(\"directions\", [])\n                        and d.get(\"rule_id\") == anomaly[\"rule_id\"]]\n            malformed = [d for d in relevant if d.get(\"status\") == \"active\"\n                         and any(d.get(key) in (None, \"\") for key in\n                                 (\"version\", \"effective_date\", \"effective_from\", \"effective_until\"))]\n            if malformed:\n                missing.append(\"MISSING_METADATA\")\n                continue\n            matches = [d for d in relevant if d.get(\"status\") == \"active\"\n                       and timestamp(d[\"effective_from\"]) <= as_of < timestamp(d[\"effective_until\"])]\n            if len(matches) != 1:\n                missing.append(\"VERSION_CONFLICT\" if len(matches) > 1 else \"NO_APPLICABLE_EVIDENCE\")\n                continue\n            doc = matches[0]\n            verified = []\n            rejected = []\n            for hit in retrieval_result:\n                citation, reason = verify_controlled_hit(hit, doc)\n                if citation:\n                    verified.append(citation)\n                elif reason:\n                    rejected.append(reason)\n                    if isinstance(hit, dict):\n                        metadata = hit.get(\"metadata\") or {}\n                        doc_metadata = metadata.get(\"doc_metadata\") or {} if isinstance(metadata, dict) else {}\n                        claims_source = (isinstance(metadata, dict) and (\n                            metadata.get(\"document_id\") == doc.get(\"document_id\")\n                            or isinstance(doc_metadata, dict) and doc_metadata.get(\"source_key\") == doc.get(\"chunk_id\")))\n                        contains_passage = isinstance(hit.get(\"content\"), str) and doc[\"content\"] in hit[\"content\"]\n                        if claims_source or contains_passage:\n                            missing.append(reason)\n            if len(verified) != 1:\n                missing.extend(rejected or [\"NO_DIRECT_SUPPORT\"])\n                continue\n            if not doc[\"checks\"] or any(check not in doc[\"content\"] for check in doc[\"checks\"]):\n                missing.append(\"INVALID_CHECKLIST\")\n                continue\n            source = verified[0]\n            if source not in sources:\n                sources.append(source)\n            for check in doc[\"checks\"]:\n                item = {\"text\": check, \"chunk_id\": source[\"chunk_id\"], \"segment_id\": source[\"segment_id\"]}\n                if item not in checks:\n                    checks.append(item)\n    except (KeyError, TypeError, ValueError, AttributeError):\n        missing.append(\"INVALID_EVIDENCE\")\n    if missing:\n        result.update(status=\"abstain\", code=\"INSUFFICIENT_EVIDENCE\", evidence_reason_codes=sorted(set(missing)),\n                      message=\"异常事实已确认，但正式规程证据不足。拒绝生成确定性处置建议，请人工确认。\",\n                      suggested_checks=[], sources=[])\n        return packet(result)\n    result.update(status=\"review_required\", code=\"SUPPORTED_CHECKLIST\",\n                  message=\"异常事实和对应规则已核对；下列检查项摘自有效正式演示规程，须人工确认。\",\n                  suggested_checks=checks, sources=sources)\n    result[\"trace\"].append(\"compose_six_part_report\")\n    return packet(result)\n\n\ndef evidence_abstain(result, reasons):\n    result.update(status=\"abstain\", code=\"INSUFFICIENT_EVIDENCE\",\n                  evidence_reason_codes=sorted(set(reasons)),\n                  message=\"异常事实已确认，但受控来源或当前版本不可验证；停止建议并请求人工确认。\",\n                  suggested_checks=[], sources=[])\n    return packet(result)\n\n\ndef inspect_catalog(previous, status_code, body, manifest):\n    \"\"\"Check the whole live Dify catalog, so top-k cannot hide version conflicts.\"\"\"\n    result = json.loads(previous)\n    result[\"trace\"].append(\"validate_live_source_catalog\")\n    if result.get(\"status\") != \"process_anomaly\":\n        return stop(result, \"system\", \"INVALID_TRANSITION\", \"没有确认的异常事实，停止证据流程。\")\n    if status_code != 200:\n        return stop(result, \"system\", \"KNOWLEDGE_CATALOG_FAILURE\", \"知识目录接口失败，停止建议并请求人工确认。\")\n    reasons = []\n    try:\n        catalog = json.loads(body)\n        documents = catalog[\"data\"]\n        if (not isinstance(documents, list) or catalog.get(\"has_more\") is not False\n                or catalog.get(\"page\") != 1 or catalog.get(\"total\") != len(documents)):\n            raise ValueError(\"incomplete catalog\")\n        context = result[\"data_used\"]\n        as_of = timestamp(context[\"snapshot_at\"]).timestamp()\n        current = []\n        seen = set()\n        controlled = {doc[\"document_id\"]: doc for doc in manifest[\"documents\"]}\n        if len(controlled) != len(manifest[\"documents\"]):\n            raise ValueError(\"duplicate controlled document identity\")\n        for entry in documents:\n            if entry[\"id\"] in seen:\n                raise ValueError(\"duplicate catalog identity\")\n            seen.add(entry[\"id\"])\n            if entry.get(\"enabled\") is not True or entry.get(\"archived\") is not False:\n                continue\n            metadata_list = entry[\"doc_metadata\"]\n            if not isinstance(metadata_list, list):\n                raise ValueError(\"structured catalog metadata required\")\n            metadata = {item[\"name\"]: item[\"value\"] for item in metadata_list}\n            if len(metadata) != len(metadata_list):\n                raise ValueError(\"duplicate metadata\")\n            if metadata.get(\"status\") in (\"expired\", \"revoked\", \"inactive\", \"future\"):\n                continue\n            required = (\"status\", \"scope\", \"steel_grade\", \"process_stage\", \"rule_id\", \"version\",\n                        \"effective_date\", \"effective_from\", \"effective_until\", \"parameters\", \"directions\")\n            if any(metadata.get(key) in (None, \"\") for key in required):\n                reasons.append(\"MISSING_METADATA\")\n                continue\n            if metadata[\"status\"] != \"active\":\n                reasons.append(\"INVALID_METADATA\")\n                continue\n            start, end = metadata_epoch(metadata[\"effective_from\"]), metadata_epoch(metadata[\"effective_until\"])\n            effective_date = metadata_epoch(metadata[\"effective_date\"])\n            if start >= end or effective_date != start:\n                reasons.append(\"INVALID_METADATA\")\n                continue\n            if not start <= as_of < end:\n                continue\n            if (metadata[\"scope\"] != context[\"scope\"]\n                    or metadata[\"steel_grade\"] != context[\"heat\"][\"steel_grade\"]\n                    or metadata[\"process_stage\"] != context[\"process_stage\"]\n                    or metadata[\"rule_id\"] != context[\"rule\"][\"rule_id\"]):\n                continue\n            current.append(metadata)\n            doc = controlled.get(entry[\"id\"])\n            if not doc or entry.get(\"indexing_status\") != \"completed\":\n                reasons.append(\"UNCONTROLLED_CURRENT_SOURCE\")\n                continue\n            expected = controlled_fixture_hit(doc)[\"metadata\"][\"doc_metadata\"]\n            if entry.get(\"name\") != doc[\"source_file_name\"] or any(\n                    metadata.get(key) != value for key, value in expected.items()):\n                reasons.append(\"CATALOG_METADATA_MISMATCH\")\n        for anomaly in result[\"anomaly_facts\"]:\n            matches = [meta for meta in current if anomaly[\"parameter\"] in meta[\"parameters\"].split(\",\")\n                       and anomaly[\"direction\"] in meta[\"directions\"].split(\",\")]\n            if len(matches) != 1:\n                reasons.append(\"VERSION_CONFLICT\" if len(matches) > 1 else \"NO_APPLICABLE_EVIDENCE\")\n    except (KeyError, TypeError, ValueError, AttributeError, OverflowError):\n        reasons.append(\"INVALID_SOURCE_CATALOG\")\n    return evidence_abstain(result, reasons) if reasons else packet(result, \"retrieve\")\n\n\ndef evidence_with_catalog(previous, retrieval_result, status_code, body, manifest):\n    catalog = inspect_catalog(previous, status_code, body, manifest)\n    if catalog[\"state\"] != \"retrieve\":\n        return catalog\n    return evidence_decision(catalog[\"result\"], retrieval_result, manifest)\n\n\ndef transport_failure(previous, stage):\n    result = json.loads(previous)\n    result[\"trace\"].append(stage + \"_transport_failure\")\n    return stop(result, \"system\", \"TRANSPORT_FAILURE\", \"系统调用失败，停止后续推断或建议，提示人工确认。\")\n\n\"\"\"Stage B: bounded DeepSeek synthesis after the unchanged Stage A evidence gate.\n\nStandard-library only, so the same parser/schema/coverage checks run in Dify Code.\nNo free-text entailment claim: output sentences must equal allowed MES/rule facts\nor pre-reviewed checks. Sources are copied from verified hits, never from the LLM.\n\"\"\"\nimport copy\nimport hashlib\nimport json\nimport re\n\n\ndef object_schema(properties):\n    return {\"type\": \"object\", \"properties\": properties, \"required\": list(properties), \"additionalProperties\": False}\n\n\nTEXT = {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 16000}\nID = {\"type\": \"string\", \"minLength\": 1, \"maxLength\": 128}\nSOURCE_SCHEMA = object_schema({\n    \"citation_id\": ID, \"dataset_id\": ID, \"document_id\": ID, \"segment_id\": ID,\n    \"document_name\": TEXT, \"version\": ID, \"effective_date\": ID, \"scope\": ID,\n    \"chapter\": TEXT, \"section\": TEXT,\n    \"page\": {\"type\": [\"integer\", \"null\"], \"minimum\": 1},\n    \"content_sha256\": {\"type\": \"string\", \"pattern\": \"^[0-9a-f]{64}$\"},\n})\nCLAIM_SCHEMA = object_schema({\"claim_id\": ID, \"text\": TEXT})\nCHECK_SCHEMA = object_schema({\"check_id\": ID, \"text\": TEXT,\n                             \"citation_ids\": {\"type\": \"array\", \"items\": ID, \"minItems\": 1, \"maxItems\": 8}})\nGENERATION_SCHEMA = object_schema({\n    \"answer\": TEXT,\n    \"analysis_summary\": {\"type\": \"array\", \"items\": CLAIM_SCHEMA, \"minItems\": 1, \"maxItems\": 8},\n    \"check_recommendations\": {\"type\": \"array\", \"items\": CHECK_SCHEMA, \"minItems\": 1, \"maxItems\": 32},\n    \"citations\": {\"type\": \"array\", \"items\": SOURCE_SCHEMA, \"minItems\": 1, \"maxItems\": 8},\n    \"human_confirmation\": TEXT,\n})\nFINAL_GENERATION_SCHEMA = object_schema({\n    \"schema_version\": {\"type\": \"string\", \"pattern\": \"^1\\\\.0$\"},\n    \"model\": {\"type\": \"string\", \"pattern\": \"^deepseek-flash$\"},\n    \"request_id\": ID,\n    **GENERATION_SCHEMA[\"properties\"],\n})\n\n\nclass GenerationError(ValueError):\n    pass\n\n\ndef validate_schema(value, schema):\n    \"\"\"Validate the exact closed JSON Schema subset above; no type coercion.\n\n    This validator is deliberately limited to our checked schema keywords, not\n    a replacement for a general-purpose JSON Schema library.\n    \"\"\"\n    known = {\"type\", \"properties\", \"required\", \"additionalProperties\", \"items\", \"minItems\", \"maxItems\",\n             \"minLength\", \"maxLength\", \"minimum\", \"pattern\"}\n    if set(schema) - known: raise GenerationError(\"UNSUPPORTED_SCHEMA\")\n    types = schema[\"type\"] if isinstance(schema[\"type\"], list) else [schema[\"type\"]]\n    kinds = {\"object\": dict, \"array\": list, \"string\": str, \"integer\": int, \"null\": type(None)}\n    if not any(type(value) is kinds[k] for k in types): raise GenerationError(\"SCHEMA_TYPE\")\n    if value is None: return\n    if isinstance(value, dict):\n        if set(value) != set(schema[\"required\"]): raise GenerationError(\"SCHEMA_FIELDS\")\n        for key, item in value.items(): validate_schema(item, schema[\"properties\"][key])\n    elif isinstance(value, list):\n        if not schema.get(\"minItems\", 0) <= len(value) <= schema.get(\"maxItems\", 100):\n            raise GenerationError(\"SCHEMA_ARRAY_LENGTH\")\n        for item in value: validate_schema(item, schema[\"items\"])\n    elif isinstance(value, str):\n        if not schema.get(\"minLength\", 0) <= len(value) <= schema.get(\"maxLength\", 16000):\n            raise GenerationError(\"SCHEMA_STRING_LENGTH\")\n        if \"pattern\" in schema and not re.fullmatch(schema[\"pattern\"], value): raise GenerationError(\"SCHEMA_PATTERN\")\n    elif type(value) is int and value < schema.get(\"minimum\", value): raise GenerationError(\"SCHEMA_MINIMUM\")\n\n\ndef no_duplicate_keys(pairs):\n    result = {}\n    for key, value in pairs:\n        if key in result: raise GenerationError(\"DUPLICATE_JSON_KEY\")\n        result[key] = value\n    return result\n\n\ndef strict_json(text):\n    return json.loads(text, object_pairs_hook=no_duplicate_keys,\n                      parse_constant=lambda value: (_ for _ in ()).throw(GenerationError(\"NONFINITE_JSON\")))\n\n\ndef parse_model_text(text):\n    \"\"\"Recognize complete wrappers only, then consume one complete JSON object.\n\n    Never search for the first/last brace or repair malformed/truncated JSON.\n    Arbitrary prose, multiple objects, incomplete/nested reasoning tags fail.\n    \"\"\"\n    if not isinstance(text, str) or len(text) > 100000: raise GenerationError(\"INVALID_MODEL_TEXT\")\n    text, reasoning = text.strip(), \"\"\n    if text.startswith(\"<think>\"):\n        end = text.find(\"</think>\", len(\"<think>\"))\n        if end < 0: raise GenerationError(\"UNCLOSED_THINK\")\n        reasoning = text[len(\"<think>\"):end]\n        if \"<think>\" in reasoning: raise GenerationError(\"NESTED_THINK\")\n        text = text[end + len(\"</think>\"):].strip()\n    if text.startswith(\"```\"):\n        lines = text.splitlines()\n        if len(lines) < 3 or lines[0] not in (\"```\", \"```json\") or lines[-1] != \"```\":\n            raise GenerationError(\"INVALID_CODE_FENCE\")\n        text = \"\\n\".join(lines[1:-1])\n    try:\n        value = strict_json(text)\n    except (ValueError, TypeError, RecursionError) as exc:\n        raise GenerationError(\"INVALID_JSON\") from exc\n    return value, reasoning\n\n\ndef stable_id(prefix, payload):\n    value = json.dumps(payload, ensure_ascii=False, sort_keys=True, allow_nan=False)\n    return prefix + hashlib.sha256(value.encode(\"utf-8\")).hexdigest()[:32]\n\n\ndef render_answer(summary, checks, human):\n    return \"\\n\".join([item[\"text\"] for item in summary] +\n                     [item[\"text\"] + \" \" + \" \".join(\"[cite:\" + key + \"]\" for key in item[\"citation_ids\"])\n                      for item in checks] + [human])\n\n\ndef generation_catalog(previous, retrieval_result, request_id=None):\n    \"\"\"Bind this generation request to Stage A verified sources and native hits.\"\"\"\n    result = strict_json(previous)\n    if result.get(\"status\") != \"review_required\" or not result.get(\"sources\"):\n        raise GenerationError(\"UNVERIFIED_GENERATION_INPUT\")\n    if not isinstance(request_id, str) or not 1 <= len(request_id) <= 128:\n        raise GenerationError(\"MISSING_GENERATION_REQUEST_ID\")\n    binding = [request_id, result[\"heat_id\"], result[\"analysis_request\"], result[\"data_used\"][\"snapshot_at\"]]\n    citations, by_segment = [], {}\n    for source in result[\"sources\"]:\n        matches = [hit for hit in retrieval_result if isinstance(hit, dict) and isinstance(hit.get(\"metadata\"), dict)\n                   and all(hit[\"metadata\"].get(k) == source[k] for k in (\"dataset_id\", \"document_id\", \"segment_id\"))]\n        if len(matches) != 1: raise GenerationError(\"VERIFIED_HIT_NOT_AVAILABLE\")\n        hit = matches[0]; metadata = hit[\"metadata\"].get(\"doc_metadata\", {})\n        if (hit.get(\"content\") != source[\"quote\"]\n                or hashlib.sha256(hit[\"content\"].encode(\"utf-8\")).hexdigest() != source[\"content_sha256\"]\n                or metadata.get(\"scope\") != result[\"data_used\"][\"scope\"]\n                or any(metadata.get(k) != source[k] for k in (\"version\", \"chapter\", \"section\", \"page\", \"content_sha256\"))):\n            raise GenerationError(\"VERIFIED_HIT_CHANGED\")\n        citation = {key: source[key] for key in SOURCE_SCHEMA[\"properties\"] if key not in (\"citation_id\", \"scope\")}\n        citation[\"scope\"] = metadata[\"scope\"]\n        citation[\"citation_id\"] = stable_id(\"cite_\", [binding, citation])\n        citations.append(citation)\n        by_segment[source[\"segment_id\"]] = citation[\"citation_id\"]\n    summary = []\n    for fact in result[\"anomaly_facts\"]:\n        direction = \"低于下限\" if fact[\"direction\"] == \"low\" else \"高于上限\"\n        text = (f\"{fact['parameter']} 实测 {fact['actual']} {fact['unit']}；MES 当前规则 {fact['rule_id']} \"\n                f\"范围 [{fact['minimum']}, {fact['maximum']}] {fact['unit']}；{direction}。\")\n        summary.append({\"claim_id\": stable_id(\"fact_\", [binding, fact]), \"text\": text})\n    checks = [{\"check_id\": stable_id(\"check_\", [binding, item]), \"text\": item[\"text\"],\n               \"citation_ids\": [by_segment[item[\"segment_id\"]]]} for item in result[\"suggested_checks\"]]\n    catalog = {\"answer\": render_answer(summary, checks, result[\"human_confirmation\"]), \"analysis_summary\": summary,\n               \"check_recommendations\": checks, \"citations\": citations, \"human_confirmation\": result[\"human_confirmation\"]}\n    validate_schema(catalog, GENERATION_SCHEMA)\n    return catalog\n\n\ndef generation_failure(previous, code=\"LLM_PROVIDER_FAILURE\", category=\"system\"):\n    result = strict_json(previous)\n    result.update(status=\"abstain\" if category == \"evidence\" else \"system_error\", category=category, code=code,\n                  message=\"生成或引用校验未通过，无法确认处置建议；请人工核对原始事实与企业规程。\",\n                  sources=[], suggested_checks=[], automatic_actions=[])\n    result.pop(\"generation\", None)\n    result[\"trace\"].append(\"generation_fail_closed\")\n    return {\"state\": \"end\", \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False)}\n\n\ndef prepare_generation(previous, retrieval_result, request_id=None):\n    result = strict_json(previous)\n    if result.get(\"status\") != \"review_required\":\n        return {\"state\": \"end\", \"result\": previous, \"payload\": \"\"}\n    try:\n        catalog = generation_catalog(previous, retrieval_result, request_id)\n        return {\"state\": \"generate\", \"result\": previous,\n                \"payload\": json.dumps(catalog, ensure_ascii=False, allow_nan=False)}\n    except (KeyError, ValueError, TypeError, AttributeError):\n        failure = generation_failure(previous, \"UNVERIFIED_GENERATION_INPUT\", \"evidence\")\n        return {**failure, \"payload\": \"\"}\n\n\ndef validate_generation(previous, retrieval_result, text, structured_output=None, finish_reason=\"stop\", reasoning_content=\"\", request_id=None):\n    try:\n        catalog = generation_catalog(previous, retrieval_result, request_id)\n        allowed = {item[\"citation_id\"]: item for item in catalog[\"citations\"]}\n        if finish_reason not in (\"stop\", \"tool_calls\"): raise GenerationError(\"INCOMPLETE_MODEL_OUTPUT\")\n        reasoning = reasoning_content or \"\"\n        if not isinstance(reasoning, str): raise GenerationError(\"INVALID_REASONING\")\n        parsed = None\n        if text:\n            parsed, tagged_reasoning = parse_model_text(text)\n            reasoning += tagged_reasoning\n        if structured_output is not None:\n            validate_schema(structured_output, GENERATION_SCHEMA)\n            if parsed is not None and parsed != structured_output: raise GenerationError(\"NATIVE_TEXT_MISMATCH\")\n            parsed = structured_output\n        validate_schema(parsed, GENERATION_SCHEMA)\n        # Reasoning is never rendered; explicit forged references still reject.\n        references = re.finditer(r\"\\[cite:([^\\]]+)\\]|\\bcite_[0-9a-f]{32}\\b|citation_id[\\\"']?\\s*:\\s*[\\\"']([^\\\"']+)\", reasoning)\n        flattened = [match.group(1) or match.group(2) or match.group(0) for match in references]\n        # Syntax-only templates in private reasoning are not source identities.\n        # They are never rendered, and are NOT allowed in the final citations.\n        templates = {\"citation_id\", \"...\", \"<citation_id>\", \"<id>\"}\n        if any(key not in allowed and key not in templates for key in flattened):\n            raise GenerationError(\"UNAUTHORIZED_REASONING_CITATION\")\n        citations = parsed[\"citations\"]\n        ids = [source[\"citation_id\"] for source in citations]\n        if len(ids) != len(set(ids)) or set(ids) != set(allowed): raise GenerationError(\"CITATION_COVERAGE\")\n        if any(source != allowed[source[\"citation_id\"]] for source in citations): raise GenerationError(\"CITATION_METADATA_CHANGED\")\n        for field, identifier in ((\"analysis_summary\", \"claim_id\"), (\"check_recommendations\", \"check_id\")):\n            expected = {item[identifier]: item for item in catalog[field]}\n            actual_ids = [item[identifier] for item in parsed[field]]\n            if len(actual_ids) != len(set(actual_ids)) or set(actual_ids) != set(expected):\n                raise GenerationError(\"CLAIM_COVERAGE\")\n            if any(item != expected[item[identifier]] for item in parsed[field]): raise GenerationError(\"UNSUPPORTED_GENERATED_CLAIM\")\n        if parsed[\"human_confirmation\"] != catalog[\"human_confirmation\"]: raise GenerationError(\"HUMAN_CONFIRMATION_CHANGED\")\n        if parsed[\"answer\"] != render_answer(parsed[\"analysis_summary\"], parsed[\"check_recommendations\"], parsed[\"human_confirmation\"]):\n            raise GenerationError(\"ANSWER_CITATION_MISMATCH\")\n        result = strict_json(previous)\n        # Authoritative citations are copied from the bound hit catalog, not the model echo.\n        safe = copy.deepcopy(parsed)\n        safe[\"citations\"] = [copy.deepcopy(allowed[key]) for key in ids]\n        result[\"generation\"] = {\"schema_version\": \"1.0\", \"model\": \"deepseek-flash\", \"request_id\": request_id, **safe}\n        validate_schema(result[\"generation\"], FINAL_GENERATION_SCHEMA)\n        result[\"code\"] = \"SUPPORTED_GENERATION\"\n        result[\"trace\"] += [\"deepseek_synthesis\", \"validate_generation_schema\", \"validate_citation_coverage\"]\n        return {\"state\": \"end\", \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False)}\n    except GenerationError as exc:\n        reason = str(exc)\n        evidence = reason in {\"UNVERIFIED_GENERATION_INPUT\", \"VERIFIED_HIT_NOT_AVAILABLE\", \"VERIFIED_HIT_CHANGED\",\n                              \"MISSING_GENERATION_REQUEST_ID\",\n                              \"CITATION_COVERAGE\", \"CITATION_METADATA_CHANGED\", \"CLAIM_COVERAGE\",\n                              \"UNSUPPORTED_GENERATED_CLAIM\", \"UNAUTHORIZED_REASONING_CITATION\",\n                              \"ANSWER_CITATION_MISMATCH\", \"HUMAN_CONFIRMATION_CHANGED\"}\n        return generation_failure(previous, reason, \"evidence\" if evidence else \"system\")\n    except (KeyError, ValueError, TypeError, AttributeError, RecursionError):\n        return generation_failure(previous, \"GENERATION_INVALID_OUTPUT\")\n\n\"\"\"Stage C deterministic facts and a wrapper around frozen Stage B validation.\n\nThe marked imports are replaced with the exact frozen A/B sources in Dify Code.\nAPI facts are separate from document citations. Hashes are integrity checks, not\nsignatures or protection from an administrator changing the source systems.\n\"\"\"\nimport copy\nimport hashlib\nimport json\nfrom urllib.parse import quote\n\n\n\nENTERPRISE_MODEL_SCHEMA = object_schema({\n    \"mes_report\": GENERATION_SCHEMA,\n    \"enterprise_summary\": {\"type\": \"array\", \"items\": CLAIM_SCHEMA, \"minItems\": 1, \"maxItems\": 8},\n})\n\nENTITY_FIELDS = {\n    \"MES\": {\"heat_id\", \"production_order_id\", \"steel_grade\", \"material_code\", \"batch_id\", \"source_updated_at\", \"revision\",\n            \"expected_erp_revision\", \"expected_wms_revision\"},\n    \"ERP\": {\"production_order_id\", \"heat_ids\", \"steel_grade\", \"planned_quantity\", \"completed_quantity\", \"quantity_unit\",\n            \"due_date\", \"status\", \"material_code\", \"batch_id\", \"required_quantity\", \"material_unit\", \"source_updated_at\", \"revision\"},\n    \"WMS\": {\"batch_id\", \"material_code\", \"material_name\", \"production_order_id\", \"available_quantity\", \"unit\",\n            \"warehouse\", \"location\", \"status\", \"source_updated_at\", \"revision\"},\n}\n\n\nclass EnterpriseError(ValueError):\n    def __init__(self, code, category=\"data\"):\n        super().__init__(code)\n        self.category = category\n\n\ndef enterprise_digest(value):\n    canonical = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(\",\", \":\"), allow_nan=False)\n    return hashlib.sha256(canonical.encode(\"utf-8\")).hexdigest()\n\n\ndef enterprise_packet(result, state=\"end\"):\n    output = {\"state\": state, \"result\": json.dumps(result, ensure_ascii=False, allow_nan=False)}\n    link = result.get(\"enterprise_evidence\", {}).get(\"mes\", {}).get(\"facts\", {}).get(\"task_link\") or {}\n    output.update(order_encoded=quote(link.get(\"production_order_id\", \"\"), safe=\"\"),\n                  batch_encoded=quote(link.get(\"batch_id\", \"\"), safe=\"\"))\n    return output\n\n\ndef enterprise_stamp(result):\n    bundle = result[\"enterprise_evidence\"]\n    bundle.pop(\"integrity_sha256\", None)\n    bundle[\"integrity_sha256\"] = enterprise_digest(bundle)\n    result[\"data_sources\"] = [copy.deepcopy(p) for key in (\"mes\", \"erp\", \"wms\") for p in bundle[key][\"provenance\"]]\n\n\ndef enterprise_stop(result, system, code, category=\"data\", critical=False):\n    result.update(status=\"abstain\" if category == \"evidence\" else category+\"_error\", category=category, code=code,\n                  message=\"联合证据未完整验证；不能补全缺失订单、物料或批次，请人工确认。\",\n                  suggested_checks=[], sources=[], automatic_actions=[])\n    result.pop(\"generation\", None); result.pop(\"enterprise_generation\", None)\n    result[\"enterprise_status\"] = \"critical_failure\" if critical else \"partial_evidence\"\n    result[\"missing_sources\"] = [{\"system\": system, \"category\": category, \"code\": code}]\n    result[\"trace\"].append(\"enterprise_fail_closed\")\n    if \"enterprise_evidence\" in result:\n        for key in (\"mes\", \"erp\", \"wms\"):\n            if not result[\"enterprise_evidence\"][key][\"verified\"] and key.upper() != system:\n                result[\"missing_sources\"].append({\"system\": key.upper(), \"category\": \"data\", \"code\": \"DEPENDENCY_NOT_VERIFIED\"})\n        enterprise_stamp(result)\n    return enterprise_packet(result)\n\n\ndef enterprise_empty(entity_id=None):\n    return {\"verified\": False, \"entity_id\": entity_id, \"facts\": {}, \"provenance\": []}\n\n\ndef enterprise_provenance(system, operation, endpoint, entity_id, request_id, body, facts):\n    return {\"system\": system, \"operation_id\": operation, \"endpoint\": endpoint, \"entity_id\": entity_id,\n            \"request_id\": request_id, \"revision\": facts.get(\"revision\"),\n            \"source_updated_at\": facts.get(\"source_updated_at\", facts.get(\"snapshot_at\")),\n            \"content_sha256\": enterprise_digest(facts),\n            \"response_body_sha256\": hashlib.sha256(body.encode(\"utf-8\")).hexdigest()}\n\n\ndef enterprise_begin(previous, context_body, request_id):\n    result = strict_json(previous)\n    if result[\"status\"] not in (\"process_anomaly\", \"no_anomaly\"): return enterprise_packet(result)\n    try:\n        if not isinstance(request_id, str) or not 1 <= len(request_id) <= 128:\n            raise EnterpriseError(\"MISSING_ENTERPRISE_REQUEST_ID\", \"system\")\n        context = strict_json(context_body)\n        if context != result[\"data_used\"]: raise EnterpriseError(\"MES_CONTEXT_CHANGED\")\n        heat = result[\"heat_id\"]\n        provenance = enterprise_provenance(\"MES\", \"get_mes_heat_analysis_context\",\n            \"/api/mes/heats/\"+quote(heat, safe=\"\")+\"/analysis-context\", heat, request_id, context_body, context)\n        result[\"enterprise_evidence\"] = {\"request_id\": request_id, \"heat_id\": heat,\n            \"mes\": {\"verified\": True, \"entity_id\": heat, \"facts\": {\"analysis_context\": context, \"task_link\": None}, \"provenance\": [provenance]},\n            \"erp\": enterprise_empty(), \"wms\": enterprise_empty(), \"rag\": {\"verified_hits\": []}}\n        result.update(data_sources=[], missing_sources=[], enterprise_status=\"collecting\")\n        enterprise_stamp(result)\n        return enterprise_packet(result, \"continue\")\n    except (KeyError, ValueError, TypeError, AttributeError):\n        return enterprise_stop(result, \"MES\", \"MES_CONTEXT_CHANGED\", critical=True)\n\n\ndef enterprise_decode(result, system, status_code, body, request_id):\n    if status_code <= 0 or status_code >= 500 or status_code in (401, 403, 429):\n        raise EnterpriseError(\"UPSTREAM_TIMEOUT\" if status_code == 504 else \"UPSTREAM_FAILURE\", \"system\")\n    try:\n        if not isinstance(body, str) or len(body) > 100000: raise ValueError(\"body\")\n        response = strict_json(body)\n        if status_code != 200:\n            error = response[\"error\"]\n            if (status_code in (404, 409) and error[\"category\"] == \"data\"\n                    and isinstance(error[\"code\"], str)):\n                raise EnterpriseError(error[\"code\"])\n            raise EnterpriseError(\"INVALID_RESPONSE\", \"system\")\n        if set(response) != {\"request_id\", \"data\", \"content_sha256\"}: raise ValueError(\"envelope\")\n        if response[\"request_id\"] != request_id or result[\"enterprise_evidence\"][\"request_id\"] != request_id:\n            raise EnterpriseError(\"CROSS_REQUEST_EVIDENCE_REPLAY\")\n        data = response[\"data\"]\n        if not isinstance(data, dict) or set(data) != ENTITY_FIELDS[system]: raise ValueError(\"fields\")\n        if response[\"content_sha256\"] != enterprise_digest(data): raise EnterpriseError(\"API_CONTENT_HASH_MISMATCH\")\n        if type(data[\"revision\"]) is not int or data[\"revision\"] < 1: raise ValueError(\"revision\")\n        for name, value in data.items():\n            if name in (\"revision\", \"expected_erp_revision\", \"expected_wms_revision\"):\n                if type(value) is not int or value < 1: raise ValueError(\"revision\")\n                continue\n            if name == \"heat_ids\":\n                if (not isinstance(value, list) or not value or len(value) != len(set(value))\n                        or any(not isinstance(v, str) or not v.strip() for v in value)): raise ValueError(\"heat_ids\")\n            elif name in {\"planned_quantity\", \"completed_quantity\", \"required_quantity\", \"available_quantity\"}:\n                if finite_number(value) < 0: raise ValueError(\"quantity\")\n            elif not isinstance(value, str) or not value.strip(): raise ValueError(\"text\")\n        as_of = timestamp(result[\"data_used\"][\"snapshot_at\"])\n        age = (as_of-timestamp(data[\"source_updated_at\"])).total_seconds()\n        # Reuse the explicit current MES rule freshness assumption, not an LLM range.\n        if not 0 <= age <= result[\"data_used\"][\"rule\"][\"max_age_seconds\"]:\n            raise EnterpriseError(\"STALE_SOURCE_RESPONSE\")\n        if system == \"ERP\":\n            timestamp(data[\"due_date\"])\n            if data[\"completed_quantity\"] > data[\"planned_quantity\"]: raise ValueError(\"progress\")\n        return data\n    except EnterpriseError: raise\n    except (KeyError, ValueError, TypeError, AttributeError, OverflowError):\n        raise EnterpriseError(\"INVALID_RESPONSE\", \"system\")\n\n\ndef enterprise_accept(previous, system, status_code, body, request_id):\n    result = strict_json(previous)\n    result[\"trace\"].append(\"verify_\"+system.lower()+\"_enterprise_facts\")\n    try:\n        facts = enterprise_decode(result, system, status_code, body, request_id)\n        heat_id = result[\"heat_id\"]\n        if system == \"MES\":\n            if facts[\"heat_id\"] != heat_id or facts[\"steel_grade\"] != result[\"data_used\"][\"heat\"][\"steel_grade\"]:\n                raise EnterpriseError(\"CROSS_SYSTEM_IDENTITY_CONFLICT\")\n            bundle = result[\"enterprise_evidence\"]\n            bundle[\"mes\"][\"facts\"][\"task_link\"] = facts\n            operation, endpoint, entity_id = \"get_mes_heat_enterprise_links\", \"/api/mes/heats/\"+quote(heat_id, safe=\"\")+\"/enterprise-links\", heat_id\n            bundle[\"mes\"][\"provenance\"].append(enterprise_provenance(system, operation, endpoint, entity_id, request_id, body, facts))\n            bundle[\"erp\"][\"entity_id\"] = facts[\"production_order_id\"]\n            bundle[\"wms\"][\"entity_id\"] = facts[\"batch_id\"]\n        else:\n            link = result[\"enterprise_evidence\"][\"mes\"][\"facts\"][\"task_link\"]\n            if facts[\"revision\"] < link[\"expected_\"+system.lower()+\"_revision\"]:\n                raise EnterpriseError(\"SOURCE_REVISION_MISMATCH\")\n            if system == \"ERP\":\n                if (facts[\"production_order_id\"] != link[\"production_order_id\"] or heat_id not in facts[\"heat_ids\"]\n                        or facts[\"steel_grade\"] != link[\"steel_grade\"] or facts[\"material_code\"] != link[\"material_code\"]\n                        or facts[\"batch_id\"] != link[\"batch_id\"]): raise EnterpriseError(\"CROSS_SYSTEM_IDENTITY_CONFLICT\")\n                operation, endpoint, entity_id = \"get_erp_production_order\", \"/api/erp/production-orders/\"+quote(link[\"production_order_id\"], safe=\"\"), link[\"production_order_id\"]\n            else:\n                order = result[\"enterprise_evidence\"][\"erp\"][\"facts\"]\n                if any(facts[k] != link[k] for k in (\"production_order_id\", \"material_code\", \"batch_id\")):\n                    raise EnterpriseError(\"CROSS_SYSTEM_IDENTITY_CONFLICT\")\n                if facts[\"unit\"] != order[\"material_unit\"]: raise EnterpriseError(\"UNIT_MISMATCH\")\n                if facts[\"status\"] != \"available\": raise EnterpriseError(\"BATCH_NOT_AVAILABLE\")\n                operation, endpoint, entity_id = \"get_wms_inventory_batch\", \"/api/wms/batches/\"+quote(link[\"batch_id\"], safe=\"\"), link[\"batch_id\"]\n            result[\"enterprise_evidence\"][system.lower()] = {\"verified\": True, \"entity_id\": entity_id,\n                \"facts\": facts, \"provenance\": [enterprise_provenance(system, operation, endpoint, entity_id, request_id, body, facts)]}\n        enterprise_stamp(result)\n        return enterprise_packet(result, \"continue\")\n    except EnterpriseError as exc:\n        return enterprise_stop(result, system, str(exc), exc.category,\n                               critical=system == \"MES\" or str(exc) in (\"CROSS_SYSTEM_IDENTITY_CONFLICT\", \"CROSS_REQUEST_EVIDENCE_REPLAY\", \"API_CONTENT_HASH_MISMATCH\"))\n    except (KeyError, ValueError, TypeError, AttributeError):\n        return enterprise_stop(result, system, \"UNVERIFIED_CROSS_SYSTEM_RELATION\", critical=True)\n\n\ndef enterprise_joint(previous):\n    result = strict_json(previous)\n    bundle = result[\"enterprise_evidence\"]\n    if not all(bundle[key][\"verified\"] for key in (\"mes\", \"erp\", \"wms\")):\n        return enterprise_stop(result, \"ENTERPRISE\", \"UNVERIFIED_CROSS_SYSTEM_RELATION\", critical=True)\n    order, batch = bundle[\"erp\"][\"facts\"], bundle[\"wms\"][\"facts\"]\n    result[\"inventory_assessment\"] = {\"required_quantity\": order[\"required_quantity\"],\n        \"available_quantity\": batch[\"available_quantity\"], \"unit\": batch[\"unit\"],\n        \"status\": \"sufficient\" if batch[\"available_quantity\"] >= order[\"required_quantity\"] else \"insufficient\"}\n    result[\"enterprise_status\"] = \"verified\"\n    result[\"trace\"].append(\"validate_cross_system_identity\")\n    enterprise_stamp(result)\n    return enterprise_packet(result, \"retrieve\" if result[\"process_anomaly_confirmed\"] else \"facts\")\n\n\ndef enterprise_rebuild(previous, context_body, link_body, erp_body, wms_body, request_id, attach_rag=False):\n    \"\"\"Re-derive from original immutable HTTP outputs, not the model or bundle hash alone.\"\"\"\n    result = strict_json(previous)\n    # Reuse the already validated MES context; collection should not consume RAG.\n    seed = copy.deepcopy(result)\n    seed[\"status\"] = \"process_anomaly\" if result[\"process_anomaly_confirmed\"] else \"no_anomaly\"\n    seed.pop(\"enterprise_evidence\", None)\n    p = enterprise_begin(json.dumps(seed), context_body, request_id)\n    for system, body in ((\"MES\", link_body), (\"ERP\", erp_body), (\"WMS\", wms_body)):\n        if p[\"state\"] != \"continue\": raise EnterpriseError(\"ENTERPRISE_BUNDLE_INVALID\")\n        p = enterprise_accept(p[\"result\"], system, 200, body, request_id)\n    if p[\"state\"] != \"continue\": raise EnterpriseError(\"ENTERPRISE_BUNDLE_INVALID\")\n    rebuilt = strict_json(enterprise_joint(p[\"result\"])[\"result\"])\n    expected = rebuilt[\"enterprise_evidence\"]\n    incoming = copy.deepcopy(result[\"enterprise_evidence\"])\n    if attach_rag:\n        if incoming[\"rag\"] != {\"verified_hits\": []}: raise EnterpriseError(\"ENTERPRISE_BUNDLE_INVALID\")\n    else:\n        expected[\"rag\"][\"verified_hits\"] = copy.deepcopy(result[\"sources\"])\n        expected.pop(\"integrity_sha256\", None); expected[\"integrity_sha256\"] = enterprise_digest(expected)\n    if incoming != expected or result[\"inventory_assessment\"] != rebuilt[\"inventory_assessment\"]:\n        raise EnterpriseError(\"ENTERPRISE_BUNDLE_INVALID\")\n    result[\"enterprise_evidence\"][\"rag\"][\"verified_hits\"] = copy.deepcopy(result[\"sources\"])\n    enterprise_stamp(result)\n    return result\n\n\ndef enterprise_summary(result, request_id):\n    bundle = result[\"enterprise_evidence\"]\n    order, batch = bundle[\"erp\"][\"facts\"], bundle[\"wms\"][\"facts\"]\n    inventory = result[\"inventory_assessment\"]\n    sentences = [\n        f\"ERP 订单 {order['production_order_id']} 明确关联炉次 {result['heat_id']}，钢种 {order['steel_grade']}，状态 {order['status']}。\",\n        f\"ERP 计划 {order['planned_quantity']} {order['quantity_unit']}，完成 {order['completed_quantity']} {order['quantity_unit']}，交期 {order['due_date']}。\",\n        f\"WMS 物料 {batch['material_code']}（{batch['material_name']}），批次 {batch['batch_id']}，可用 {batch['available_quantity']} {batch['unit']}，仓库 {batch['warehouse']} / 仓位 {batch['location']}。\",\n        f\"ERP 指定需求 {inventory['required_quantity']} {inventory['unit']}，WMS 指定批次可用 {inventory['available_quantity']} {inventory['unit']}；确定性比较：{'足够' if inventory['status']=='sufficient' else '不足'}。仅为该任务该批次事实，不是工艺处置授权。\",\n    ]\n    # API text belongs to business facts, never the document-citation namespace.\n    if any(\"[cite:\" in text for text in sentences):\n        raise EnterpriseError(\"API_FACT_CITATION_MARKER\", \"evidence\")\n    return [{\"claim_id\": stable_id(\"api_fact_\", [request_id, bundle[\"integrity_sha256\"], text]), \"text\": text} for text in sentences]\n\n\ndef enterprise_prepare(previous, retrieval_result, context_body, link_body, erp_body, wms_body, request_id):\n    result = strict_json(previous)\n    if result[\"status\"] != \"review_required\": return {\"state\": \"end\", \"result\": previous, \"payload\": \"\"}\n    try:\n        mes = generation_catalog(previous, retrieval_result, request_id)\n        result = enterprise_rebuild(previous, context_body, link_body, erp_body, wms_body, request_id, attach_rag=True)\n        payload = {\"mes_report\": mes, \"enterprise_summary\": enterprise_summary(result, request_id)}\n        validate_schema(payload, ENTERPRISE_MODEL_SCHEMA)\n        return {\"state\": \"generate\", \"result\": json.dumps(result, ensure_ascii=False), \"payload\": json.dumps(payload, ensure_ascii=False)}\n    except EnterpriseError as exc:\n        stopped = enterprise_stop(result, \"ENTERPRISE\", str(exc), exc.category, critical=True)\n        return {\"state\": \"end\", \"result\": stopped[\"result\"], \"payload\": \"\"}\n    except (KeyError, ValueError, TypeError, AttributeError):\n        failure = enterprise_stop(result, \"ENTERPRISE\", \"ENTERPRISE_BUNDLE_INVALID\", critical=True)\n        return {\"state\": \"end\", \"result\": failure[\"result\"], \"payload\": \"\"}\n\n\ndef enterprise_validate(previous, retrieval_result, text, structured_output, finish_reason, reasoning_content,\n                        context_body, link_body, erp_body, wms_body, request_id):\n    try:\n        result = enterprise_rebuild(previous, context_body, link_body, erp_body, wms_body, request_id)\n        parsed, tagged = parse_model_text(text) if text else (None, \"\")\n        if structured_output is not None:\n            validate_schema(structured_output, ENTERPRISE_MODEL_SCHEMA)\n            if parsed is not None and parsed != structured_output: raise GenerationError(\"NATIVE_TEXT_MISMATCH\")\n            parsed = structured_output\n        validate_schema(parsed, ENTERPRISE_MODEL_SCHEMA)\n        validated = validate_generation(previous, retrieval_result, json.dumps(parsed[\"mes_report\"], ensure_ascii=False),\n            parsed[\"mes_report\"], finish_reason, (reasoning_content or \"\")+tagged, request_id)\n        checked = strict_json(validated[\"result\"])\n        if checked[\"status\"] != \"review_required\": return validated\n        expected = {item[\"claim_id\"]: item for item in enterprise_summary(result, request_id)}\n        actual = parsed[\"enterprise_summary\"]\n        identifiers = [item[\"claim_id\"] for item in actual]\n        if len(set(identifiers)) != len(identifiers) or set(identifiers) != set(expected):\n            raise EnterpriseError(\"ENTERPRISE_FACT_COVERAGE\", \"evidence\")\n        if any(item != expected[item[\"claim_id\"]] for item in actual): raise EnterpriseError(\"UNVERIFIED_GENERATED_API_FACT\", \"evidence\")\n        # Provenance remains authoritative Code output; model has no such field.\n        checked[\"enterprise_generation\"] = {\"schema_version\": \"1.0\", \"request_id\": request_id,\n            \"facts_summary\": copy.deepcopy(actual),\n            \"answer\": checked[\"generation\"][\"answer\"]+\"\\n\"+\"\\n\".join(item[\"text\"] for item in actual)}\n        checked[\"code\"] = \"SUPPORTED_ENTERPRISE_GENERATION\"\n        checked[\"trace\"].append(\"validate_enterprise_fact_coverage\")\n        return {\"state\": \"end\", \"result\": json.dumps(checked, ensure_ascii=False, allow_nan=False)}\n    except EnterpriseError as exc:\n        failure = enterprise_stop(strict_json(previous), \"ENTERPRISE\", str(exc), exc.category, critical=True)\n        return {\"state\": failure[\"state\"], \"result\": failure[\"result\"]}\n    except (GenerationError, KeyError, ValueError, TypeError, AttributeError, RecursionError):\n        return generation_failure(previous, \"ENTERPRISE_GENERATION_INVALID_OUTPUT\")\n\ndef main(previous, context_body, request_id):\n    return enterprise_begin(previous, context_body, request_id)\n",
